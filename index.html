<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#24324A">
<title>ENT Residency Program</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F2F4F6;--surface:#FFFFFF;--ink:#1C2536;--muted:#5C6676;--line:#D8DDE4;--brand:#24324A;--on-brand:#fff;--act:#3B5BDB;--act-soft:#E6EBFB;
--l1:#E9EEF3;--l1t:#5C6676;--l2:#CFE5DA;--l2t:#245A44;--l3:#6DB493;--l3t:#0F2E22;--l4:#1F6B4E;--l4t:#FFFFFF;
--ent:#DCE6F7;--sub:#D6EEE3;--ext:#F6E5CF;--res:#EADFF5;--chief:#F3D6D6;--warn:#B45309;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10151D;--surface:#171E29;--ink:#E3E8EF;--muted:#98A2B1;--line:#2A3444;--brand:#9DB3E0;--on-brand:#0E1626;--act:#8EA6F2;--act-soft:#1E2A47;
--l1:#212A37;--l1t:#98A2B1;--l2:#1E3B30;--l2t:#A9D9C1;--l3:#2F7A5A;--l3t:#E8FFF4;--l4:#62C79A;--l4t:#0B2219;
--ent:#22304A;--sub:#1E3A30;--ext:#3D3020;--res:#33284A;--chief:#43262A;--warn:#F0A44B;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header.app{background:var(--brand);color:var(--on-brand);padding:18px 16px 0}
header.app .in{max-width:980px;margin:0 auto}
header.app h1{margin:0;font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
header.app p{margin:2px 0 12px;opacity:.85;font-size:.9rem}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:980px;margin:0 auto}
nav.tabs button{flex:none;border:0;background:none;color:inherit;opacity:.75;padding:10px 12px 12px;font-weight:600;border-bottom:3px solid transparent}
nav.tabs button[aria-selected=true]{opacity:1;border-bottom-color:currentColor}
main{max-width:980px;margin:0 auto;padding:18px 16px 80px}
h2{font-size:1.15rem;margin:26px 0 10px}h2:first-child{margin-top:0}
h3{font-size:1rem;margin:18px 0 8px}
.lead{color:var(--muted);margin:-4px 0 14px;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:600;font-size:.9rem}
.btn.p{background:var(--act);border-color:var(--act);color:#fff}
@media (prefers-color-scheme:dark){.btn.p{color:#0E1626}}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn.d{color:#B42318}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.86rem;color:var(--muted)}
.chips button[aria-pressed=true]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
/* this week */
.session{display:grid;grid-template-columns:120px 1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.session .date{background:var(--brand);color:var(--on-brand);padding:14px;display:flex;flex-direction:column;justify-content:center}
.session .date b{font-size:2rem;line-height:1}.session .date span{font-size:.85rem;opacity:.85}
.session ol{list-style:none;margin:0;padding:6px 14px}
.session li{padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.session li:first-child{border-top:0}
.session .tm{color:var(--muted);font-size:.85rem;padding-top:1px;min-width:46px}
.session .what{font-weight:600}.session .who{grid-column:2;color:var(--muted);font-size:.88rem}
.session li.quiz .what{color:var(--warn)}
@media (max-width:520px){.session{grid-template-columns:1fr}.session .date{flex-direction:row;gap:10px;align-items:baseline}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem}.kv:first-of-type{border-top:0}
.kv span:first-child{font-weight:600;white-space:nowrap}.kv span:last-child{color:var(--muted);text-align:right}
/* lectures */
.block{margin-bottom:18px}
.block .bh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.block .bh h3{margin:0}.block .bh small{color:var(--muted)}
.lec{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.lec:first-child{border-top:0}
.lec .d{font-weight:600;font-size:.88rem}.lec .d small{display:block;color:var(--muted);font-weight:400}
.lec .t{font-weight:600}.lec .s{font-size:.86rem;color:var(--muted);margin-top:2px}
.lec select{font-size:.82rem;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--surface);max-width:180px}
.lec.special .t{color:var(--warn)}
.lec.past{opacity:.55}
.lec .skip{float:right}
/* matrix */
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.84rem;margin:0 0 12px}
.legend i{display:inline-flex;width:22px;height:22px;border-radius:5px;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:.78rem;margin-right:5px;vertical-align:middle}
table.mx{width:100%;border-collapse:separate;border-spacing:0 3px;font-size:.9rem}
table.mx th{font-size:.8rem;color:var(--muted);font-weight:600;text-align:center;padding:4px}
table.mx th:first-child{text-align:left}
table.mx td{padding:0}
table.mx td.p{padding:6px 8px 6px 0;font-weight:500}
table.mx td.c{width:46px}
table.mx td.c i{display:flex;height:30px;margin:0 2px;border-radius:5px;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:.8rem}
table.mx td.tg{width:58px;text-align:right;color:var(--muted);font-size:.85rem;padding-right:4px}
table.mx tr.grp td{padding:14px 0 2px;font-weight:700;font-size:.92rem}
table.mx .dim{opacity:.28}
.L1{background:var(--l1);color:var(--l1t)}.L2{background:var(--l2);color:var(--l2t)}.L3{background:var(--l3);color:var(--l3t)}.L4{background:var(--l4);color:var(--l4t)}
/* rotations */
.rgrid{overflow-x:auto}
table.rt{border-collapse:separate;border-spacing:2px;font-size:.78rem;min-width:760px;width:100%;table-layout:fixed}
table.rt th{color:var(--muted);font-weight:600;padding:4px;text-align:center}
table.rt th.n{text-align:left;width:130px;font-size:.86rem;color:var(--ink)}
table.rt td{padding:6px 4px;border-radius:5px;text-align:center;line-height:1.2;vertical-align:middle}
.c-none{background:transparent;color:var(--muted)}.c-ent{background:var(--ent)}.c-sub{background:var(--sub)}.c-ext{background:var(--ext)}.c-res{background:var(--res)}.c-chief{background:var(--chief)}
.plan .yr{margin-bottom:14px}
.bar{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar div{padding:8px 6px;font-size:.8rem;line-height:1.25;border-right:2px solid var(--surface)}
.bar div:last-child{border-right:0}
.bar small{display:block;opacity:.7}
/* lists */
.list .it{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it .m{flex:1;min-width:0}.list .it .m b{display:block}.list .it .m small{color:var(--muted)}
.lvl{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;border-radius:6px;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:.82rem}
label.f{display:block;margin-bottom:10px}label.f span{display:block;font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:3px}
label.f input,label.f select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:9px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;font-size:.9rem}
.toast.show{opacity:1}
.note{font-size:.85rem;color:var(--muted)}
.quiz{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.quiz:first-child{border-top:0}
.quiz .t{font-weight:600}.quiz .s{font-size:.86rem;color:var(--muted)}
.tag{display:inline-block;font-size:.74rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--act-soft);color:var(--act);margin-left:6px;vertical-align:1px}
.res-card{border-top:1px solid var(--line);padding:12px 0}.res-card:first-child{border-top:0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:16px 16px 22px}
.sheet h3{margin:0 0 4px}
.st-held{color:#1F7A4D;font-weight:700}.st-cancel{color:#B42318;font-weight:700}.st-none{color:var(--muted)}
.attl label{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.attl label:first-child{border-top:0}
.attl input[type=checkbox]{width:20px;height:20px}
.attl input[type=number]{width:80px;margin-left:auto;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin:8px 0 12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:7px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--on-brand)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpis div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpis b{display:block;font-size:1.5rem;line-height:1.2}.kpis span{font-size:.8rem;color:var(--muted)}
table.rep{width:100%;border-collapse:collapse;font-size:.84rem}
table.rep th,table.rep td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
table.rep th{color:var(--muted);font-weight:600;font-size:.78rem;background:var(--bg)}
table.rep td.n{text-align:center}
.rep-wrap{overflow-x:auto}
.lock{position:fixed;inset:0;z-index:80;background:var(--brand);color:var(--on-brand);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center}
.lock.open{display:flex}
.dots{display:flex;gap:12px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid currentColor}.dots i.f{background:currentColor}
.pad{display:grid;grid-template-columns:repeat(3,70px);gap:12px}
.pad button{height:62px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:inherit;font-size:1.4rem;font-weight:600}
.gate{max-width:440px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.gate h2{margin-top:0}
.viewer-tag{display:inline-block;margin-left:8px;font-size:.75rem;background:rgba(255,255,255,.2);padding:1px 8px;border-radius:999px;vertical-align:3px}
@media print{header.app nav,.noprint,.btn,.toast,.scrim,.lock{display:none!important}.kpis div{border-color:#bbb}table.rep{font-size:10.5pt}table.rep th{background:#eee}h2{break-after:avoid}.panel{break-inside:auto}header.app{background:none;color:#000}body{background:#fff}.panel{border-color:#bbb}main{padding:0}}
</style>

function slotsRaw(){
  const blocks=CURRICULUM[ST.cycle],out=[];
  blocks.forEach((b,bi)=>{
    b.topics.forEach((t,ti)=>out.push({kind:"lec",bi,ti,block:b,topic:t,quiz:ti===4}));
    if(bi===3)out.push({kind:"exam",title:"Mid-year assessment",desc:"OSCE stations and viva for all residents on blocks 1–4. Supervisor mid-year meetings this week."});
    if(bi===5)out.push({kind:"exam",title:"Mock board exams",desc:"R2: Part I mock (basic sciences). R5: Part II mock (written paper and viva). Others: progress test, 60 MCQs."});
    if(bi===7)out.push({kind:"exam",title:"End-of-year exam",desc:"100 MCQs plus OSCE for all residents. Followed by annual reviews and logbook sign-off."});
  });
  let d=ST.start;const skips=new Set(ST.skips);let wk=0;
  for(const s of out){while(skips.has(d))d=addD(d,7);s.date=d;s.week=++wk;s.key=ST.cycle+"|"+(s.kind==="lec"?s.bi+"-"+s.ti:s.title);d=addD(d,7)}
  assign(out);return out;
}
function slots(){return applyEdits(slotsRaw())}
function rr(pool,i){return pool.length?pool[i%pool.length]:null}
function assign(out){
  const all=sortedRes();let ci=0,li=0,ji=0,mi=0;
  for(const s of out){
    s.items=[];
    if(s.kind!=="lec"){s.items.push({tm:ST.times[0],what:s.title,who:s.desc,cls:"quiz"});continue}
    const lecN=s.bi*5+s.ti;
    let first;
    if(lecN%4===0){const pool=all.filter(r=>r.level>=3);first={role:"jc",what:"Journal club",who:rr(pool.length?pool:all,ji++)}}
    else if(lecN%4===2){const pool=all.filter(r=>r.level>=4);first={role:"mm",what:"Morbidity and mortality meeting",who:rr(pool.length?pool:all,mi++)}}
    else first={role:"case",what:"Case presentation",who:rr(all,ci++)};
    const [lo,hi]=s.block.lead;let pool=all.filter(r=>r.level>=lo&&r.level<=hi);if(!pool.length)pool=all;
    const lec={role:"lec",what:s.topic,who:rr(pool,li++),ref:s.block.ref};
    [first,lec].forEach(it=>{const ov=ST.override[s.key+"|"+it.role];if(ov&&resById(ov))it.who=resById(ov)});
    s.items.push({tm:ST.times[0],what:first.what,who:first.who?first.who.name+" (R"+first.who.level+")":"Assign a resident",role:first.role,rid:first.who&&first.who.id});
    s.items.push({tm:ST.times[1],what:lec.what,who:(lec.who?"Presenter: "+lec.who.name+" (R"+lec.who.level+"), consultant facilitator":"Consultant lecture")+"<br><span class='note'>Reading: "+esc(lec.ref)+"</span>",role:"lec",rid:lec.who&&lec.who.id,raw:true});
    if(s.quiz)s.items.push({tm:ST.times[2],what:"Block quiz: "+s.block.name,who:"40 MCQs on this block, 45 minutes, reviewed together afterwards",cls:"quiz"});
    else s.items.push({tm:ST.times[2],what:lecN%2?"Image and audiogram review":"Instrument and OSCE station practice",who:"Seniors lead, juniors answer"});
  }
}

function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function shareSession(key){
  const s=slots().find(x=>x.key===key);if(!s)return;const d=dt(s.date);
  const txt=`${ST.name}\nAcademic session: ${DAY[d.getDay()]} ${fdy(s.date)}\n\n`+s.items.map(it=>`${it.tm}  ${it.what}\n       ${String(it.who).replace(/<br>/g,"\n       ").replace(/<[^>]+>/g,"")}`).join("\n\n");
  try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(e.name==="AbortError")return}

function reportData(a,b){
  const t=today(),res=sortedRes(),S=slots().filter(s=>s.date>=a&&s.date<=b);
  const ROLE={case:"Case presentation",jc:"Journal club",mm:"M&M",lec:"Core lecture"};
  const per=Object.fromEntries(res.map(r=>[r.id,{r,case:0,jc:0,mm:0,lec:0,att:0,heldN:0,scores:[]}]));
  let held=0,cancelled=0,unrec=0,upcoming=0;
  const rows=S.map(s=>{const L=ST.log[s.key];let status=L?L.status:(s.date>t?"upcoming":"none");
    if(status==="held")held++;else if(status==="cancelled")cancelled++;else if(status==="upcoming")upcoming++;else unrec++;
    if(status==="held"){res.forEach(r=>{per[r.id].heldN++;if((L.att||[]).includes(r.id))per[r.id].att++});
      (s.items||[]).forEach(it=>{if(it.rid&&per[it.rid]&&it.role&&per[it.rid][it.role]!=null)per[it.rid][it.role]++});
      if(L.scores)Object.entries(L.scores).forEach(([id,v])=>{if(per[id])per[id].scores.push(v)})}
    const first=s.kind==="lec"?s.items[0]:null,lec=s.kind==="lec"?s.items[1]:(s.kind==="extra"?s.items[0]:null);
    return {date:s.date,week:s.week,block:s.kind==="lec"?s.bi+1:"",title:s.kind==="lec"?s.topic:s.title,
      firstType:first?first.what:"",firstBy:first&&first.rid?resById(first.rid).name:"",
      coreBy:lec?(lec.rid?resById(lec.rid).name:"Consultant"):"",quiz:isAssess(s)?(s.kind==="lec"?"Block quiz":s.title):"",
      status,att:L&&L.status==="held"?(L.att||[]).length:"",notes:L?L.notes||"":"",key:s.key,s}});
  const quizzes=rows.filter(x=>x.quiz&&x.status==="held");
  const skips=ST.skips.filter(d=>d>=a&&d<=b).sort();
  const m0=Math.max(0,monthIndex(a)),m1=Math.min(11,monthIndex(b));
  const rot=res.map(r=>{const ms=rotFor(r);const names=[];for(let i=m0;i<=m1;i++){if(ms[i]&&!names.includes(ms[i].n))names.push(ms[i].n)}return {r,names}});
  return {a,b,rows,per:Object.values(per),held,cancelled,unrec,upcoming,quizzes,skips,rot,res,ROLE};
}

const b64=buf=>{let s="";const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pass,salt){const k=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function sha(s){return b64(await crypto.subtle.digest("SHA-256",enc.encode(s)))}
async function buildShared(pass){const d=JSON.parse(JSON.stringify(ST));["pinHash","pinSalt","viewPass","role","published"].forEach(k=>delete d[k]);
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await keyFrom(pass,salt),enc.encode(JSON.stringify(d)));
  return JSON.stringify({app:"ent-program",v:1,updated:new Date().toISOString(),salt:b64(salt),iv:b64(iv),data:b64(ct)})}
async function openShared(txt,pass){const j=JSON.parse(txt);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(j.iv)},await keyFrom(pass,unb64(j.salt)),unb64(j.data));return {data:JSON.parse(dec.decode(pt)),updated:j.updated}}

/* PIN pad */
let pinBuf="",pinMode="unlock",pinFirst="",hiddenAt=0;
function showLock(m){pinMode=m;pinBuf="";pinFirst="";$("#lockT").textContent=m==="set"?"Choose a 4-digit PIN":"Enter PIN";$("#lerr").textContent="";drawDots();$("#lock").classList.add("open")}
function drawDots(){$("#dots").innerHTML=[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?"f":""}"></i>`).join("")}
$("#pad").innerHTML=[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button data-k="${k}">${k}</button>`).join("");
$("#pad").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.k;
  if(k==="⌫"){pinBuf=pinBuf.slice(0,-1);drawDots();return}if(pinBuf.length>=4)return;pinBuf+=k;drawDots();if(pinBuf.length<4)return;
  const v=pinBuf;pinBuf="";
  if(pinMode==="unlock"){if(await sha(ST.pinSalt+v)===ST.pinHash){$("#lock").classList.remove("open")}else{$("#lerr").textContent="Wrong PIN";drawDots()}}
  else{if(!pinFirst){pinFirst=v;$("#lockT").textContent="Enter it again";drawDots()}else if(pinFirst===v){ST.pinSalt=b64(crypto.getRandomValues(new Uint8Array(12)));ST.pinHash=await sha(ST.pinSalt+v);save();$("#lock").classList.remove("open");toast("PIN set");render()}else{pinFirst="";$("#lockT").textContent="PINs did not match. Choose a 4-digit PIN";drawDots()}}};

function rulesText(owner){owner=(owner||"YOUR_EMAIL@example.com").trim().toLowerCase();return `rules_version = '2';
service cloud.firestore {
  match /databases/{db}/documents {
    function signedIn() { return request.auth != null && request.auth.token.email_verified == true; }
    function email() { return request.auth.token.email.lower(); }
    function lists() { return get(/databases/$(db)/documents/access/lists).data; }
    function hasLists() { return exists(/databases/$(db)/documents/access/lists); }
    function isOwner() { return signedIn() && email() == '${owner}'; }
    function isAdmin() { return isOwner() || (signedIn() && hasLists() && email() in lists().admins); }
    function isViewer() { return isAdmin() || (signedIn() && hasLists() && email() in lists().viewers); }
    match /access/lists { allow read, write: if isAdmin(); }
    match /program/public { allow read: if isViewer(); allow write: if isAdmin(); }
    match /program/private { allow read, write: if isAdmin(); }
  }
}`}
function parseCfg(t){const g=k=>{const m=t.match(new RegExp(k+'\\s*:\\s*["\\\']([^"\\\']+)["\\\']'));return m?m[1]:null};const c={};["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId"].forEach(k=>{const v=g(k);if(v)c[k]=v});return c.apiKey&&c.projectId&&c.appId?c:null}

function applyEdits(out){
  const E=ST.sess||{};
  out.forEach(s=>{const o=E[s.key];if(!o)return;
    if(o.date)s.date=o.date;
    if(o.topic){if(s.kind==="lec"){s.topic=o.topic;s.items[1].what=o.topic}else{s.title=o.topic;s.items[0].what=o.topic}}
    if(o.desc!=null&&s.kind==="exam"){s.desc=o.desc;s.items[0].who=o.desc}
    if(s.kind==="lec"){
      if(o.firstType)s.items[0].what=o.firstType;
      if(o.quiz!=null&&o.quiz!==s.quiz){s.quiz=o.quiz;s.items[2]=o.quiz?{tm:ST.times[2],what:"Quiz: "+s.block.name,who:"MCQs on this block, reviewed together afterwards",cls:"quiz"}:{tm:ST.times[2],what:"Image and audiogram review",who:"Seniors lead, juniors answer"}}
      if(o.third&&!s.quiz)s.items[2]={tm:ST.times[2],what:o.third,who:""};
    }
    if(o.note)s.note=o.note;
    if(o.hidden)s.hidden=true;
  });
  (ST.extra||[]).forEach(x=>{const pr=x.presenter&&resById(x.presenter);
    out.push({kind:"extra",key:"X|"+x.id,id:x.id,date:x.date,week:"",title:x.title,desc:x.desc||"",quiz:!!x.quiz,note:x.note||"",

  return out.filter(s=>!s.hidden).sort((a,b)=>a.date.localeCompare(b.date)||(a.week||99)-(b.week||99));
}

  <div class="row"><button class="btn p" id="e_save">Save</button><button class="btn" id="e_cancel">Cancel</button>${(ST.sess||{})[key]?'<button class="btn" id="e_reset">Reset to original</button>':""}</div>`);
  $("#e_cancel").onclick=closeSheet;
  if($("#e_reset"))$("#e_reset").onclick=()=>{delete ST.sess[key];delete ST.override[key+"|lec"];delete ST.override[key+"|"+s.items[0].role];save();closeSheet();render()};
  $("#e_save").onclick=()=>{
    const n={};const d=$("#e_date").value;if(d&&d!==s.date)n.date=d;
    const tp=$("#e_topic").value.trim();if(tp&&tp!==(s.kind==="lec"?s.topic:s.title))n.topic=tp;
    if(s.kind==="lec"){const f=$("#e_first").value;if(f!==s.items[0].what)n.firstType=f;const th=$("#e_third").value.trim();if(th)n.third=th;const q=$("#e_quiz").checked;if(q!==s.quiz)n.quiz=q;
      [["e_p0",s.items[0].role],["e_p1","lec"]].forEach(([id,role])=>{const v=$("#"+id).value;if(v)ST.override[key+"|"+role]=v;else delete ST.override[key+"|"+role]})}
    else{const ds=$("#e_desc").value.trim();if(ds!==s.desc)n.desc=ds}
    const nt=$("#e_note").value.trim();if(nt)n.note=nt;if($("#e_hide").checked)n.hidden=true;
    ST.sess=ST.sess||{};if(Object.keys(n).length)ST.sess[key]=n;else delete ST.sess[key];save();closeSheet();toast("Saved");render()};
}
function extraSheet(id){
  const x=id?(ST.extra||[]).find(e=>e.id===id):{date:today(),time:ST.times[0],title:"",presenter:"",desc:"",quiz:false,note:""};if(!x)return;
  openSheet(`<h3>${id?"Edit extra session":"Add a session"}</h3>
  <div class="row"><label class="f" style="flex:1"><span>Date</span><input type="date" id="x_date" value="${x.date}"></label><label class="f" style="flex:1"><span>Time</span><input type="time" id="x_time" value="${x.time||""}"></label></div>
  <label class="f"><span>Title</span><input id="x_title" value="${esc(x.title)}" placeholder="e.g. Temporal bone dissection workshop"></label>
  <label class="f"><span>Presenter</span><select id="x_pr">${resOptions(x.presenter)}</select></label>
  <label class="f"><span>Details (shown when there is no resident presenter)</span><input id="x_desc" value="${esc(x.desc||"")}" placeholder="e.g. Dr. … (consultant)"></label>
  <label class="f"><span>Note</span><input id="x_note" value="${esc(x.note||"")}"></label>
  <label style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><input type="checkbox" id="x_quiz" ${x.quiz?"checked":""}> This is a quiz or exam</label>
  <div class="row"><button class="btn p" id="x_save">Save</button><button class="btn" id="x_cancel">Cancel</button>${id?'<button class="btn d" id="x_del">Delete</button>':""}</div>`);
  $("#x_cancel").onclick=closeSheet;
  if($("#x_del"))$("#x_del").onclick=()=>{if(!confirm("Delete this session?"))return;ST.extra=ST.extra.filter(e=>e.id!==id);save();closeSheet();render()};
  $("#x_save").onclick=()=>{const t=$("#x_title").value.trim();if(!t||!$("#x_date").value){toast("Add a title and date");return}
    const n={id:id||Date.now().toString(36),date:$("#x_date").value,time:$("#x_time").value,title:t,presenter:$("#x_pr").value,desc:$("#x_desc").value.trim(),quiz:$("#x_quiz").checked,note:$("#x_note").value.trim()};
    ST.extra=(ST.extra||[]).filter(e=>e.id!==n.id).concat([n]);save();closeSheet();toast("Saved");render()};
}
/* ================= rotations: per-resident blocks ================= */
function rpOf(r){ST.rp=ST.rp||{};if(!ST.rp[r.id])ST.rp[r.id]={rot:[],hist:[],since:"",boardStart:"",email:"",phone:"",notes:""};return ST.rp[r.id]}
function templateMonths(r){
  const peers=sortedRes().filter(x=>x.level===r.level);const j=Math.max(0,peers.findIndex(x=>x.id===r.id));
  const plan=ROTATIONS[r.level]||[];const sh=plan.length?j%plan.length:0;const order=plan.slice(sh).concat(plan.slice(0,sh));
  const months=[];order.forEach(([n,m,c])=>{for(let k=0;k<m;k++)months.push({n,c})});return months.slice(0,12);
}
function addMonths(s,m){const d=dt(s);d.setMonth(d.getMonth()+m);return iso(d)}
function rotAt(r,date){const p=(ST.rp||{})[r.id];if(p&&p.rot&&p.rot.length){const x=p.rot.find(z=>z.from<=date&&date<=z.to);return x?{n:x.name,c:x.cat||"ent"}:null}
  const mi=monthIndex(date);return mi>=0&&mi<12?templateMonths(r)[mi]:null}
function rotFor(r){const s=dt(ST.start),out=[];for(let i=0;i<12;i++){const d=iso(new Date(s.getFullYear(),s.getMonth()+i,15));out.push(rotAt(r,d)||{n:"—",c:"none"})}return out}
function standardBlocks(r,from){const tm=templateMonths(r);const out=[];let i=0;while(i<tm.length){let j=i;while(j+1<tm.length&&tm[j+1].n===tm[i].n)j++;const f=addMonths(from,i);out.push({id:Math.random().toString(36).slice(2,8),name:tm[i].n,cat:tm[i].c,from:f,to:addD(addMonths(from,j+1),-1)});i=j+1}return out}
const CATN={ent:"ENT core",sub:"ENT subspecialty",ext:"Outside ENT",res:"Elective or research",chief:"Chief resident"};
function profile(id){
  const r=resById(id);if(!r)return;const p=rpOf(r);
  const blocks=(p.rot||[]).slice().sort((a,b)=>a.from.localeCompare(b.from));const now=rotAt(r,today());
  const yrs=r.level+(p.boardStart?"":"");
  openSheet(`<h3>${esc(r.name)} <span class="lvl">R${r.level}</span></h3>
  <div class="note">${now?"Now: <b>"+esc(now.n)+"</b>":"No rotation set for today"}${p.since?" · R"+r.level+" since "+fdy(p.since):""}${p.boardStart?" · Board started "+fdy(p.boardStart):""}</div>
  <div class="panel" style="margin-top:10px">
   <div class="row"><label class="f" style="flex:2;min-width:160px"><span>Name</span><input id="p_name" value="${esc(r.name)}"></label><label class="f" style="flex:1;min-width:90px"><span>Year</span><select id="p_lvl">${[1,2,3,4,5].map(y=>`<option value="${y}" ${y===r.level?"selected":""}>R${y}</option>`).join("")}</select></label></div>
   <div class="row"><label class="f" style="flex:1;min-width:140px"><span>Board start date</span><input type="date" id="p_bs" value="${p.boardStart||""}"></label><label class="f" style="flex:1;min-width:140px"><span>In current year since</span><input type="date" id="p_since" value="${p.since||""}"></label></div>
   <div class="row"><label class="f" style="flex:1;min-width:160px"><span>Phone</span><input id="p_phone" dir="ltr" value="${esc(p.phone||"")}"></label><label class="f" style="flex:1;min-width:160px"><span>Email</span><input id="p_email" dir="ltr" value="${esc(p.email||"")}"></label></div>
   <label class="f"><span>Notes</span><input id="p_notes" value="${esc(p.notes||"")}"></label>
  </div>
  <h3>Rotations this year</h3>
  ${blocks.length?"":`<p class="note">Following the standard R${r.level} plan automatically. Customise it to set exact dates.</p>`}
  <div id="p_blocks">${blocks.map(b=>blockRow(b)).join("")}</div>
  <div class="row" style="margin-top:8px"><button class="btn" id="p_add">+ Add rotation</button><button class="btn" id="p_std">Fill with standard R${r.level} plan</button></div>
  ${(p.hist||[]).length?`<h3>Previous years</h3>${p.hist.slice().reverse().map(hh=>`<div class="panel" style="margin-bottom:8px"><b>R${hh.level}</b> <span class="note">${hh.from?fdy(hh.from):"?"} to ${fdy(hh.to)}</span>${(hh.rot||[]).length?`<div class="note">${hh.rot.map(b=>esc(b.name)+" ("+fd(b.from)+"–"+fd(b.to)+")").join("; ")}</div>`:'<div class="note">Standard plan</div>'}</div>`).join("")}`:""}
  <div class="row" style="margin-top:14px"><button class="btn p" id="p_save">Save</button><button class="btn" id="p_promote">${r.level<5?"Move to R"+(r.level+1):"Graduate"}</button><button class="btn" id="p_close">Close</button><button class="btn d" id="p_del">Remove</button></div>`);
  const coll=()=>[...document.querySelectorAll("#p_blocks .blk")].map(el=>({id:el.dataset.id,name:el.querySelector(".b_n").value.trim(),cat:el.querySelector(".b_c").value,from:el.querySelector(".b_f").value,to:el.querySelector(".b_t").value})).filter(b=>b.name&&b.from&&b.to);
  const wire=()=>document.querySelectorAll("#p_blocks .b_x").forEach(b=>b.onclick=()=>b.closest(".blk").remove());wire();
  $("#p_add").onclick=()=>{const last=coll().sort((a,b)=>a.from.localeCompare(b.from)).pop();const f=last?addD(last.to,1):(p.since||ST.start);$("#p_blocks").insertAdjacentHTML("beforeend",blockRow({id:Math.random().toString(36).slice(2,8),name:"",cat:"ent",from:f,to:addD(addMonths(f,3),-1)}));wire()};
  $("#p_std").onclick=()=>{const f=prompt("Start date of this year's plan (YYYY-MM-DD)",p.since||ST.start);if(!f)return;$("#p_blocks").innerHTML=standardBlocks(r,f).map(blockRow).join("");wire()};
  $("#p_close").onclick=closeSheet;
  $("#p_save").onclick=()=>{r.name=$("#p_name").value.trim()||r.name;r.level=+$("#p_lvl").value;Object.assign(p,{boardStart:$("#p_bs").value,since:$("#p_since").value,phone:$("#p_phone").value.trim(),email:$("#p_email").value.trim(),notes:$("#p_notes").value.trim(),rot:coll()});save();closeSheet();toast("Saved");render()};
  $("#p_promote").onclick=()=>{$("#p_save").onclick();if(!confirm(r.level<5?`Move ${r.name} to R${r.level+1}? This year's rotations are kept in their history.`:`Graduate ${r.name}? They move to the graduates list.`))return;promote(r);save();toast("Done");render()};
  $("#p_del").onclick=()=>{if(!confirm("Remove "+r.name+" from the program?"))return;ST.residents=ST.residents.filter(x=>x.id!==r.id);save();closeSheet();render()};
}
function blockRow(b){return `<div class="blk panel" data-id="${b.id}" style="margin-bottom:8px;padding:10px 12px"><div class="row"><input class="b_n" value="${esc(b.name)}" placeholder="Rotation, e.g. Otology" style="flex:2;min-width:150px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface)"><select class="b_c" style="flex:1;min-width:120px;padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--surface)">${Object.entries(CATN).map(([k,v])=>`<option value="${k}" ${k===b.cat?"selected":""}>${v}</option>`).join("")}</select></div>
 <div class="row" style="margin-top:6px"><label class="note">From <input type="date" class="b_f" value="${b.from}"></label><label class="note">To <input type="date" class="b_t" value="${b.to}"></label><button class="btn sm d b_x" style="margin-left:auto">Delete</button></div></div>`}
function promote(r){const p=rpOf(r);p.hist=p.hist||[];p.hist.push({level:r.level,from:p.since||ST.start,to:today(),rot:p.rot||[]});p.rot=[];p.since=today();
  if(r.level>=5){ST.graduates=(ST.graduates||[]).concat([{id:r.id,name:r.name,graduated:today(),boardStart:p.boardStart,hist:p.hist}]);ST.residents=ST.residents.filter(x=>x.id!==r.id)}else r.level++;
  Object.keys(ST.override).forEach(k=>{if(ST.override[k]===r.id)delete ST.override[k]})}
/* ================= residents tab ================= */
function vResidents(S){
  const t=today();
  let h=`<h2>Residents</h2><div class="panel noprint"><div class="row" style="align-items:flex-end"><label class="f" style="flex:2;min-width:160px;margin:0"><span>Name</span><input id="rn" placeholder="Dr. …"></label><label class="f" style="flex:1;min-width:80px;margin:0"><span>Year</span><select id="rl">${[1,2,3,4,5].map(y=>`<option value="${y}">R${y}</option>`).join("")}</select></label><label class="f" style="flex:1;min-width:130px;margin:0"><span>Board start</span><input type="date" id="rbs"></label><button class="btn p" id="radd">Add</button></div></div>`;
  if(!ST.residents.length)h+=`<div class="empty" style="margin-top:12px">No residents yet.</div>`;
  else h+=`<div class="panel" style="margin-top:12px">`+sortedRes().map(r=>{const p=(ST.rp||{})[r.id]||{};const now=rotAt(r,t);
    const mine=S.filter(s=>s.date>=t&&s.items&&s.items.some(it=>it.rid===r.id)).slice(0,2);
    return `<div class="res-card" style="cursor:pointer" data-prof="${r.id}"><div class="row"><span class="lvl">R${r.level}</span><b style="flex:1">${esc(r.name)}</b><span class="note">${p.boardStart?"Board start "+fd(p.boardStart)+" "+dt(p.boardStart).getFullYear():""}</span><span class="note">›</span></div>
    <div class="note" style="margin-top:4px"><b>Now:</b> ${now?esc(now.n):"—"}${(p.rot||[]).length?"":" (standard plan)"} · <b>Presenting next:</b> ${mine.length?mine.map(s=>fd(s.date)).join(", "):"—"}</div></div>`}).join("")+`</div>`;
  h+=`<div class="row noprint" style="margin-top:12px"><button class="btn" id="promote">Move everyone to the next year</button></div><p class="note">Tap a resident to edit their details, rotations and history, or move them to the next year on their own.</p>`;
  if((ST.graduates||[]).length)h+=`<h3>Graduates</h3><div class="panel">${ST.graduates.map(g=>`<div class="kv"><span>${esc(g.name)}</span><span>${g.boardStart?fd(g.boardStart)+" "+dt(g.boardStart).getFullYear()+" – ":""}${fdy(g.graduated)}</span></div>`).join("")}</div>`;
  return h;
}
/* ================= theatre rota ================= */
const TDAY=["Saturday","Sunday","Monday","Tuesday","Wednesday","Thursday","Friday"];
let TWK=null;
function satOf(d){const x=dt(d);x.setDate(x.getDate()-((x.getDay()+1)%7));return iso(x)}
function TH(){ST.theatre=ST.theatre||{lists:[],weeks:{}};ST.theatre.lists=ST.theatre.lists||[];ST.theatre.weeks=ST.theatre.weeks||{};return ST.theatre}
function vTheatre(){
  const T=TH();if(!TWK)TWK=satOf(today());const W=T.weeks[TWK]||{};
  let h=`<h2>Theatre rota</h2><div class="row noprint" style="margin-bottom:12px"><button class="btn" id="tprev">‹</button><b style="flex:1;text-align:center">${fd(TWK)} – ${fdy(addD(TWK,6))}</b><button class="btn" id="tnext">›</button></div>
  <div class="row noprint" style="margin-bottom:12px"><button class="btn sm" id="tnow">This week</button><button class="btn sm" id="tcopy">Copy previous week</button><button class="btn sm" id="tshare">Share week</button><button class="btn sm" id="tlists">Theatre lists</button></div>`;
  if(!T.lists.length)return h+`<div class="empty">Add your weekly theatre lists first (for example: Sunday, Main OR, Dr. …). Then assign residents to each list week by week.<br><br><button class="btn p" id="tlists2">Add theatre lists</button></div>`;
  for(let d=0;d<7;d++){const L=T.lists.filter(l=>+l.day===d);if(!L.length)continue;const date=addD(TWK,d);
    h+=`<h3>${TDAY[d]} <span class="note">${fd(date)}</span></h3><div class="panel">${L.map(l=>{const ids=W[l.id]||[];return `<div class="kv" style="align-items:center"><span>${esc(l.name)}${l.place?` <span class="note">${esc(l.place)}</span>`:""}<div style="font-weight:400;margin-top:4px">${ids.map(i=>resById(i)).filter(Boolean).map(r=>`<span class="tag">${esc(r.name)} R${r.level}</span>`).join(" ")||'<span class="note">Nobody assigned</span>'}</div></span><span><button class="btn sm noprint" data-tas="${l.id}">Assign</button></span></div>`}).join("")}</div>`}
  const cnt={};Object.values(W).forEach(a=>a.forEach(i=>cnt[i]=(cnt[i]||0)+1));
  h+=`<h3>Theatre sessions this week</h3><div class="panel">${sortedRes().map(r=>`<div class="kv"><span>${esc(r.name)} R${r.level}</span><span>${cnt[r.id]||0}</span></div>`).join("")||'<p class="note">No residents.</p>'}</div>`;
  return h;
}
function listsSheet(){const T=TH();
  const row=l=>`<div class="tl panel" data-id="${l.id}" style="margin-bottom:8px;padding:10px 12px"><div class="row"><select class="l_d" style="padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--surface)">${TDAY.map((n,i)=>`<option value="${i}" ${+l.day===i?"selected":""}>${n}</option>`).join("")}</select><input class="l_n" value="${esc(l.name)}" placeholder="List, e.g. Main OR – Dr. X" style="flex:1;min-width:150px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface)"></div><div class="row" style="margin-top:6px"><input class="l_p" value="${esc(l.place||"")}" placeholder="Hospital or room (optional)" style="flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface)"><button class="btn sm d l_x">Delete</button></div></div>`;
  openSheet(`<h3>Weekly theatre lists</h3><p class="note">The lists that repeat every week. Assign residents to them on the Theatre tab.</p><div id="tls">${T.lists.map(row).join("")}</div><div class="row"><button class="btn" id="l_add">+ Add list</button></div><div class="row" style="margin-top:12px"><button class="btn p" id="l_save">Save</button><button class="btn" id="l_cancel">Cancel</button></div>`);
  const wire=()=>document.querySelectorAll(".l_x").forEach(b=>b.onclick=()=>b.closest(".tl").remove());wire();
  $("#l_add").onclick=()=>{$("#tls").insertAdjacentHTML("beforeend",row({id:Math.random().toString(36).slice(2,8),day:1,name:"",place:""}));wire()};
  $("#l_cancel").onclick=closeSheet;
  $("#l_save").onclick=()=>{T.lists=[...document.querySelectorAll(".tl")].map(el=>({id:el.dataset.id,day:+el.querySelector(".l_d").value,name:el.querySelector(".l_n").value.trim(),place:el.querySelector(".l_p").value.trim()})).filter(l=>l.name);save();closeSheet();render()};
}
function assignSheet(lid){const T=TH();const l=T.lists.find(x=>x.id===lid);const W=T.weeks[TWK]||{};const cur=new Set(W[lid]||[]);
  openSheet(`<h3>${esc(l.name)}</h3><div class="note">${TDAY[l.day]} ${fdy(addD(TWK,+l.day))}</div><div class="panel attl" style="margin-top:10px">${sortedRes().map(r=>{const now=rotAt(r,addD(TWK,+l.day));return `<label><input type="checkbox" data-ta="${r.id}" ${cur.has(r.id)?"checked":""}> ${esc(r.name)} <span class="note">R${r.level}${now?" · "+esc(now.n):""}</span></label>`}).join("")}</div><div class="row" style="margin-top:12px"><button class="btn p" id="ta_save">Save</button><button class="btn" id="ta_cancel">Cancel</button></div>`);
  $("#ta_cancel").onclick=closeSheet;
  $("#ta_save").onclick=()=>{const ids=[...document.querySelectorAll("[data-ta]")].filter(c=>c.checked).map(c=>c.dataset.ta);T.weeks[TWK]=Object.assign({},T.weeks[TWK]);if(ids.length)T.weeks[TWK][lid]=ids;else delete T.weeks[TWK][lid];save();closeSheet();render()};
}
function bindMore(){
  const v=$("#view");
  v.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editSession(b.dataset.edit));
  const ax=$("#addsess");if(ax)ax.onclick=()=>extraSheet(null);
  v.querySelectorAll("[data-prof]").forEach(b=>b.onclick=()=>profile(b.dataset.prof));
  const T=()=>TH();
  const tp=$("#tprev");if(tp)tp.onclick=()=>{TWK=addD(TWK,-7);render()};
  const tn=$("#tnext");if(tn)tn.onclick=()=>{TWK=addD(TWK,7);render()};
  const tw=$("#tnow");if(tw)tw.onclick=()=>{TWK=satOf(today());render()};
  [$("#tlists"),$("#tlists2")].forEach(b=>{if(b)b.onclick=listsSheet});
  v.querySelectorAll("[data-tas]").forEach(b=>b.onclick=()=>assignSheet(b.dataset.tas));
  const tc=$("#tcopy");if(tc)tc.onclick=()=>{const prev=T().weeks[addD(TWK,-7)];if(!prev){toast("Previous week is empty");return}if(T().weeks[TWK]&&Object.keys(T().weeks[TWK]).length&&!confirm("Replace this week's assignments?"))return;T().weeks[TWK]=JSON.parse(JSON.stringify(prev));save();render()};
  const ts=$("#tshare");if(ts)ts.onclick=async()=>{const W=T().weeks[TWK]||{};let txt=`${ST.name}\nTheatre rota: ${fd(TWK)} – ${fdy(addD(TWK,6))}\n`;
    for(let d=0;d<7;d++){const L=T().lists.filter(l=>+l.day===d);if(!L.length)continue;txt+=`\n${TDAY[d]} ${fd(addD(TWK,d))}\n`;L.forEach(l=>{txt+=`  ${l.name}${l.place?" ("+l.place+")":""}: ${(W[l.id]||[]).map(i=>resById(i)).filter(Boolean).map(r=>r.name).join(", ")||"—"}\n`})}
    try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(e.name==="AbortError")return}try{await navigator.clipboard.writeText(txt);toast("Copied")}catch(e){prompt("Copy:",txt)}};
}
function theatreCount(id,a,b){const T=TH();let n=0;Object.entries(T.weeks).forEach(([wk,W])=>{T.lists.forEach(l=>{const d=addD(wk,+l.day);if(d>=a&&d<=b&&(W[l.id]||[]).includes(id))n++})});return n}

start();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
