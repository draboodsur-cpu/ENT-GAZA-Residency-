--l1:#212A37;--l1t:#98A2B1;--l2:#1E3B30;--l2t:#A9D9C1;--l3:#2F7A5A;--l3t:#E8FFF4;--l4:#62C79A;--l4t:#0B2219;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}

.num{font-variant-numeric:tabular-nums}
header.app{background:var(--brand);color:var(--on-brand);padding:18px 16px 0}
header.app .in{max-width:980px;margin:0 auto}
header.app h1{margin:0;font-size:1.45rem;font-weight:700;letter-spacing:-.01em}

nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:980px;margin:0 auto}

main{max-width:980px;margin:0 auto;padding:18px 16px 80px}
h2{font-size:1.15rem;margin:26px 0 10px}h2:first-child{margin-top:0}
h3{font-size:1rem;margin:18px 0 8px}
.lead{color:var(--muted);margin:-4px 0 14px;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:600;font-size:.9rem}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}

.chips button[aria-pressed=true]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
/* this week */
.session{display:grid;grid-template-columns:120px 1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.session .date{background:var(--brand);color:var(--on-brand);padding:14px;display:flex;flex-direction:column;justify-content:center}

.session li:first-child{border-top:0}
.session .tm{color:var(--muted);font-size:.85rem;padding-top:1px;min-width:46px}
.session .what{font-weight:600}.session .who{grid-column:2;color:var(--muted);font-size:.88rem}
.session li.quiz .what{color:var(--warn)}
@media (max-width:520px){.session{grid-template-columns:1fr}.session .date{flex-direction:row;gap:10px;align-items:baseline}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem}.kv:first-of-type{border-top:0}
.kv span:first-child{font-weight:600;white-space:nowrap}.kv span:last-child{color:var(--muted);text-align:right}
.kv span.w{white-space:normal;min-width:0;flex:1;overflow-wrap:anywhere}

.lec{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.lec:first-child{border-top:0}
.lec .d{font-weight:600;font-size:.88rem}.lec .d small{display:block;color:var(--muted);font-weight:400}
.lec .t{font-weight:600}.lec .s{font-size:.86rem;color:var(--muted);margin-top:2px}

.lec.special .t{color:var(--warn)}
.lec.past{opacity:.55}
.lec .skip{float:right}
/* matrix */
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.84rem;margin:0 0 12px}

table.mx{width:100%;border-collapse:separate;border-spacing:0 3px;font-size:.9rem}
table.mx th{font-size:.8rem;color:var(--muted);font-weight:600;text-align:center;padding:4px}
table.mx th:first-child{text-align:left}
table.mx td{padding:0}
table.mx td.p{padding:6px 8px 6px 0;font-weight:500}
table.mx td.c{width:46px}

table.mx tr.grp td{padding:14px 0 2px;font-weight:700;font-size:.92rem}
table.mx .dim{opacity:.28}
.L1{background:var(--l1);color:var(--l1t)}.L2{background:var(--l2);color:var(--l2t)}.L3{background:var(--l3);color:var(--l3t)}.L4{background:var(--l4);color:var(--l4t)}

.rgrid{overflow-x:auto}
table.rt{border-collapse:separate;border-spacing:2px;font-size:.78rem;min-width:760px;width:100%;table-layout:fixed}
table.rt th{color:var(--muted);font-weight:600;padding:4px;text-align:center}
table.rt th.n{text-align:left;width:130px;font-size:.86rem;color:var(--ink)}
table.rt td{padding:6px 4px;border-radius:5px;text-align:center;line-height:1.2;vertical-align:middle}
.c-none{background:transparent;color:var(--muted)}.c-ent{background:var(--ent)}.c-sub{background:var(--sub)}.c-ext{background:var(--ext)}.c-res{background:var(--res)}.c-chief{background:var(--chief)}
.plan .yr{margin-bottom:14px}
.bar{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--line)}

.list .it{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it .m{flex:1;min-width:0}.list .it .m b{display:block}.list .it .m small{color:var(--muted)}
.lvl{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;border-radius:6px;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:.82rem}
label.f{display:block;margin-bottom:10px}label.f span{display:block;font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:3px}
label.f input,label.f select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:9px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;font-size:.9rem}
.toast.show{opacity:1}
.note{font-size:.85rem;color:var(--muted)}
.quiz{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}

.tag{display:inline-block;font-size:.74rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--act-soft);color:var(--act);margin-left:6px;vertical-align:1px}
.res-card{border-top:1px solid var(--line);padding:12px 0}.res-card:first-child{border-top:0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:16px 16px 22px}
.sheet h3{margin:0 0 4px}
.st-held{color:#1F7A4D;font-weight:700}.st-cancel{color:#B42318;font-weight:700}.st-none{color:var(--muted)}
.attl label{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.attl label:first-child{border-top:0}
.attl input[type=checkbox]{width:20px;height:20px}
.attl input[type=number]{width:80px;margin-left:auto;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin:8px 0 12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:7px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--on-brand)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpis div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpis b{display:block;font-size:1.5rem;line-height:1.2}.kpis span{font-size:.8rem;color:var(--muted)}
table.rep{width:100%;border-collapse:collapse;font-size:.84rem}
table.rep th,table.rep td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
table.rep th{color:var(--muted);font-weight:600;font-size:.78rem;background:var(--bg)}
table.rep td.n{text-align:center}
.rep-wrap{overflow-x:auto}
.lock{position:fixed;inset:0;z-index:80;background:var(--brand);color:var(--on-brand);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center}
.lock.open{display:flex}
.dots{display:flex;gap:12px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid currentColor}.dots i.f{background:currentColor}
.pad{display:grid;grid-template-columns:repeat(3,70px);gap:12px}
.pad button{height:62px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:inherit;font-size:1.4rem;font-weight:600}
.gate{max-width:440px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.gate h2{margin-top:0}
.viewer-tag{display:inline-block;margin-left:8px;font-size:.75rem;background:rgba(255,255,255,.2);padding:1px 8px;border-radius:999px;vertical-align:3px}
@media print{.print-only{display:block!important}table.duty tr{break-inside:avoid}header.app nav,.noprint,.btn,.toast,.scrim,.lock{display:none!important}.kpis div{border-color:#bbb}table.rep{font-size:10.5pt}table.rep th{background:#eee}h2{break-after:avoid}.panel{break-inside:auto}header.app{background:none;color:#000}body{background:#fff}.panel{border-color:#bbb}main{padding:0}}
</style>

function old_slotsRaw(){
  const blocks=CURRICULUM[ST.cycle],out=[];
  blocks.forEach((b,bi)=>{
    b.topics.forEach((t,ti)=>out.push({kind:"lec",bi,ti,block:b,topic:t,quiz:ti===4}));
    if(bi===3)out.push({kind:"exam",title:"Mid-year assessment",desc:"OSCE stations and viva for all residents on blocks 1–4. Supervisor mid-year meetings this week."});
    if(bi===5)out.push({kind:"exam",title:"Mock board exams",desc:"R2: Part I mock (basic sciences). R5: Part II mock (written paper and viva). Others: progress test, 60 MCQs."});
    if(bi===7)out.push({kind:"exam",title:"End-of-year exam",desc:"100 MCQs plus OSCE for all residents. Followed by annual reviews and logbook sign-off."});
  });
  let d=ST.start;const skips=new Set(ST.skips);let wk=0;
  for(const s of out){while(skips.has(d))d=addD(d,7);s.date=d;s.week=++wk;s.key=ST.cycle+"|"+(s.kind==="lec"?s.bi+"-"+s.ti:s.title);d=addD(d,7)}
  old_assign(out);return out;
}
function old_rr(pool,i){return pool.length?pool[i%pool.length]:null}
function old_assign(out){
  const all=old_sorted();let ci=0,li=0,ji=0,mi=0;
  for(const s of out){
    s.items=[];
    if(s.kind!=="lec"){s.items.push({tm:ST.times[0],what:s.title,who:s.desc,cls:"quiz"});continue}
    const lecN=s.bi*5+s.ti;
    let first;
    if(lecN%4===0){const pool=all.filter(r=>r.level>=3);first={role:"jc",what:"Journal club",who:old_rr(pool.length?pool:all,ji++)}}
    else if(lecN%4===2){const pool=all.filter(r=>r.level>=4);first={role:"mm",what:"Morbidity and mortality meeting",who:old_rr(pool.length?pool:all,mi++)}}
    else first={role:"case",what:"Case presentation",who:old_rr(all,ci++)};
    const [lo,hi]=s.block.lead;let pool=all.filter(r=>r.level>=lo&&r.level<=hi);if(!pool.length)pool=all;
    const lec={role:"lec",what:s.topic,who:old_rr(pool,li++),ref:s.block.ref};
    [first,lec].forEach(it=>{const ov=ST.override[s.key+"|"+it.role];if(ov&&resById(ov))it.who=resById(ov)});
    s.items.push({tm:ST.times[0],what:first.what,who:first.who?first.who.name+" (R"+first.who.level+")":"Assign a resident",role:first.role,rid:first.who&&first.who.id});
    s.items.push({tm:ST.times[1],what:lec.what,who:(lec.who?"Presenter: "+lec.who.name+" (R"+lec.who.level+"), consultant facilitator":"Consultant lecture")+"<br><span class='note'>Reading: "+esc(lec.ref)+"</span>",role:"lec",rid:lec.who&&lec.who.id,raw:true});
    if(s.quiz)s.items.push({tm:ST.times[2],what:"Block quiz: "+s.block.name,who:"40 MCQs on this block, 45 minutes, reviewed together afterwards",cls:"quiz"});
    else s.items.push({tm:ST.times[2],what:lecN%2?"Image and audiogram review":"Instrument and OSCE station practice",who:"Seniors lead, juniors answer"});
  }
}

function old_applyEdits(out){
  const E=ST.sess||{};
  out.forEach(s=>{const o=E[s.key];if(!o)return;
    if(o.date)s.date=o.date;
    if(o.topic){if(s.kind==="lec"){s.topic=o.topic;s.items[1].what=o.topic}else{s.title=o.topic;s.items[0].what=o.topic}}
    if(o.desc!=null&&s.kind==="exam"){s.desc=o.desc;s.items[0].who=o.desc}
    if(s.kind==="lec"){
      if(o.firstType)s.items[0].what=o.firstType;
      if(o.quiz!=null&&o.quiz!==s.quiz){s.quiz=o.quiz;s.items[2]=o.quiz?{tm:ST.times[2],what:"Quiz: "+s.block.name,who:"MCQs on this block, reviewed together afterwards",cls:"quiz"}:{tm:ST.times[2],what:"Image and audiogram review",who:"Seniors lead, juniors answer"}}
      if(o.third&&!s.quiz)s.items[2]={tm:ST.times[2],what:o.third,who:""};
    }
    if(o.note)s.note=o.note;
    if(o.hidden)s.hidden=true;
  });
  (ST.extra||[]).forEach(x=>{const pr=x.presenter&&resById(x.presenter);
    out.push({kind:"extra",key:"X|"+x.id,id:x.id,date:x.date,week:"",title:x.title,desc:x.desc||"",quiz:!!x.quiz,note:x.note||"",

  return out.filter(s=>!s.hidden).sort((a,b)=>a.date.localeCompare(b.date)||(a.week||99)-(b.week||99));
}

function examStats(e){const S=ST.scores[e.id]||{};const vals=Object.values(S).filter(v=>v!==""&&v!=null&&!isNaN(v)).map(Number);const max=+e.max||100;
  return {n:vals.length,avg:vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length/max*100):null,passN:vals.filter(v=>v>=(+e.pass||0)).length}}
function vExams(){

  if(!E.length)return h+`<div class="empty">No exams yet.</div>`;
  const up=E.filter(e=>e.date>=t),pastE=E.filter(e=>e.date<t);
  const card=e=>{const s=examStats(e);return `<div class="lrow"><div class="tm">${fd(e.date)}<div class="note" style="font-weight:400">${esc(e.time||"")}</div></div><div><div class="tt">${esc(e.name)} ${e.type?`<span class="tag">${esc(e.type)}</span>`:""}${exYrTag(e)}</div>
   ${e.topics?`<div class="meta" style="white-space:pre-wrap">${esc(e.topics)}</div>`:""}${e.place?`<div class="meta">📍 ${esc(e.place)}</div>`:""}${e.notes?`<div class="meta">📝 ${esc(e.notes)}</div>`:""}
   ${VIEWER?"":`<div class="meta">${s.n?`Results: ${s.n}/${ST.residents.filter(r=>examFor(e,r)).length} entered · average ${s.avg}% · passed ${s.passN}/${s.n}`:"No results entered"}</div><div class="acts noprint"><button class="btn sm mini" data-res="${e.id}">Results</button><button class="btn sm mini" data-edx="${e.id}">Edit</button></div>`}</div></div>`};
  if(up.length)h+=`<h3>Upcoming</h3><div class="panel">${up.map(card).join("")}</div>`;
  if(pastE.length)h+=`<h3>Past</h3><div class="panel">${pastE.slice().reverse().map(card).join("")}</div>`;
  if(!VIEWER&&E.length&&ST.residents.length){
    h+=`<h3>Results by resident</h3><div class="panel rep-wrap"><table class="rep"><thead><tr><th>Resident</th>${E.map(e=>`<th class="n">${fd(e.date)}<br>${esc(e.name)}</th>`).join("")}<th class="n">Average</th></tr></thead><tbody>${sortedRes().map(r=>{const vals=[];
      const cells=E.map(e=>{const v=(ST.scores[e.id]||{})[r.id];if(!examFor(e,r))return '<td class="n note">·</td>';if(v===undefined||v===""||v===null)return '<td class="n">—</td>';const pct=Math.round(v/(+e.max||100)*100);vals.push(pct);return `<td class="n ${v>=(+e.pass||0)?"pass":"fail"}">${v}</td>`}).join("");
      return `<tr><td>${esc(r.name)} <span class="note">R${r.level}</span></td>${cells}<td class="n"><b>${vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)+"%":"—"}</b></td></tr>`}).join("")}</tbody></table><p class="note" style="margin:8px 0 0">Green: at or above the pass mark. Red: below it. A dot means the exam was not for that year.</p></div>`}
  return h;
}

function conductSheet(id,kind){const x=id?CONDB().find(e=>e.id===id):{rid:CDR||"",kind,type:CONDUCT[kind].types[0][0],cause:CONDUCT[kind].causes[0][0],date:today(),details:"",extra:"",until:""};if(!x)return;const K=CONDUCT[x.kind];

  ${field("Resident",`<select class="f2" id="c_r">${opt("","—",!x.rid)}${sortedRes().map(r=>opt(r.id,r.name+" (R"+r.level+")",r.id===x.rid)).join("")}</select>`)}

let LOGR="",LOGP="all";
function LOGB(){if(CLOGS)return CLOGS;if(!Array.isArray(ST.logbook))ST.logbook=[];return ST.logbook}
const procById=id=>(ST.procs||[]).find(p=>p.id===id);
const procName=x=>{const p=procById(x.proc);return p?p.name:(x.procText||"Other")};
const tgtNum=p=>{const m=String(p&&p.target||"").match(/\d+/);return m?+m[0]:0};
function periodRange(k){const t=today();if(k==="3m")return [addD(t,-91),t];if(k==="year")return [ST.yearStart||"0000",t];return ["0000","9999"]}
const periodSel=(id,v)=>`<select class="f2" id="${id}">${opt("all","All time",v==="all")}${opt("3m","Last 3 months",v==="3m")}${opt("year","This academic year",v==="year")}</select>`;
function logCounts(rid,a,b){const c={};LOGB().filter(x=>okRec(x)&&x.rid===rid&&x.date>=a&&x.date<=b).forEach(x=>{const k=x.proc||("t:"+(x.procText||"Other"));const o=c[k]=c[k]||[0,0,0,0,0];o[+x.role||0]+=(+x.n||1)});return c}
const hasPid=x=>!!(x&&x.pin&&x.pfile);
const pidTxt=x=>hasPid(x)?`${esc(x.pin)} · #${esc(x.pfile)} · `:"";
const pidMiss='<span class="tag" style="background:#FDECEA;color:#B42318">No patient ID</span>';
function vLogTrainer(){
  const L=LOGB().filter(x=>x.sup===MYTR),P=L.filter(x=>x.status==="pending").sort((a,b)=>b.date.localeCompare(a.date)),D=L.filter(x=>x.status!=="pending").sort((a,b)=>b.date.localeCompare(a.date));
  const row=(x,act)=>{const r=resById(x.rid)||{name:"—"};return `<div class="kv"><span class="w">${fd(x.date)} <b>${esc(r.name)}</b> · ${esc(procName(x))}${+x.n>1?" ×"+x.n:""}${act?"":" "+stTag(x.status||"ok")}${act&&!hasPid(x)?" "+pidMiss:""}<br><span class="note">${pidTxt(x)}${LV[+x.role||0]}${x.notes?" · "+esc(x.notes):""}</span></span>${act?`<span style="display:flex;gap:4px"><button class="btn sm mini p" data-lok="${x.id}">Approve</button><button class="btn sm mini" data-lno="${x.id}">Decline</button></span>`:""}</div>`};

  <h3>Decided</h3><div class="panel">${D.slice(0,40).map(x=>row(x,false)).join("")||'<p class="note">None yet.</p>'}</div>`;
}
function vLog(){
  if(VIEWER&&MYTR)return vLogTrainer();
  if(VIEWER){if(!MYRID||!resById(MYRID))return `<h2>Logbook</h2><div class="empty">Your email is not linked to your name yet. Ask the program director to link it.</div>`;LOGR=MYRID}
  const R=VIEWER?[resById(MYRID)]:sortedRes();if(LOGR&&!resById(LOGR))LOGR="";if(!LOGR&&R.length)LOGR=R[0].id;
  let h=`<h2>${VIEWER?"My logbook":"Logbook"}</h2><p class="lead">${VIEWER?"Add each case the same day. It counts once the program director approves it.":"Each case with the resident's role. Performed (under supervision or independent) counts toward the target."}</p>
  <div class="panel noprint" style="margin-bottom:12px"><div class="row"><div style="flex:2;min-width:160px;${VIEWER?"display:none":""}">${field("Resident",`<select class="f2" id="logr">${R.map(r=>opt(r.id,r.name+" (R"+r.level+")",r.id===LOGR)).join("")}</select>`)}</div><div style="flex:1;min-width:140px">${field("Period",periodSel("logp",LOGP))}</div></div>
  <div class="row"><button class="btn p" id="addlog">+ Add case</button>${!VIEWER&&LOGB().some(x=>x.status==="pending"&&x.rid===LOGR)?'<button class="btn" id="lokall">Approve all waiting</button>':""}<button class="btn" id="logcsv">Excel</button><button class="btn" onclick="window.print()">Print report</button></div></div>`;
  if(!R.length)return h+`<div class="empty">Add residents first.</div>`;
  const r=resById(LOGR),[a,b]=periodRange(LOGP),c=logCounts(r.id,a,b);
  h+=`<p class="note print-only" style="display:none">${esc(ST.name)} · Logbook · ${esc(r.name)} R${r.level} · ${LOGP==="all"?"All time":fdy(a)+" – "+fdy(b)}</p>`;
  const P=ST.procs||[],groups=[...new Set(P.map(p=>p.group))];let tot=[0,0,0,0,0],met=0,withT=0;
  let rows="";groups.forEach(g=>{let gr="";P.filter(p=>p.group===g).forEach(p=>{const k=c[p.id]||[0,0,0,0,0];const exp=(p.lv||[])[Math.min(r.level,5)-1]||0;const tg=tgtNum(p);const done=k[3]+k[4];
      k.forEach((v,i)=>tot[i]+=v);if(tg){withT++;if(done>=tg)met++}
      if(!k.some(Boolean)&&!exp)return;
      const pct=tg?Math.min(100,Math.round(done/tg*100)):null;
      gr+=`<tr><td class="p">${esc(p.name)}</td><td class="c">${exp?`<i class="L${exp}" title="${LV[exp]}">${LS[exp]}</i>`:"–"}</td>${[1,2,3,4].map(i=>`<td class="n">${k[i]||""}</td>`).join("")}<td class="n">${tg?`<span class="${done>=tg?"pass":""}">${done}/${tg}</span><div class="bar"><i style="width:${pct}%"></i></div>`:done||""}</td></tr>`});
    if(gr)rows+=`<tr class="grp"><td colspan="7">${esc(g)}</td></tr>`+gr});
  Object.keys(c).filter(k=>k.startsWith("t:")).forEach((k,i)=>{const v=c[k];v.forEach((x,j)=>tot[j]+=x);if(!i)rows+=`<tr class="grp"><td colspan="7">Other</td></tr>`;rows+=`<tr><td class="p">${esc(k.slice(2))}</td><td class="c">–</td>${[1,2,3,4].map(j=>`<td class="n">${v[j]||""}</td>`).join("")}<td class="n">${v[3]+v[4]||""}</td></tr>`});
  const all=tot.reduce((x,y)=>x+y,0);
  h+=`<div class="kpis"><div><b>${all}</b><span>cases logged</span></div><div><b>${tot[3]+tot[4]}</b><span>performed</span></div><div><b>${met}/${withT}</b><span>targets met</span></div></div>`;
  h+=`<div class="panel" style="overflow-x:auto;margin-top:12px"><table class="mx log"><thead><tr><th>Procedure</th><th title="Expected level this year">R${r.level}</th><th>O</th><th>A</th><th>S</th><th>I</th><th style="text-align:right">Performed / target</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="note">No cases logged in this period.</td></tr>'}</tbody></table>

  const PW=LOGB().filter(x=>x.rid===r.id&&x.status==="pending").sort((x,y)=>y.date.localeCompare(x.date));
  if(PW.length)h+=`<h3 class="noprint">Waiting for approval (${PW.length})</h3><div class="panel noprint">${PW.map(x=>`<div class="kv"><span class="w">${fd(x.date)} <b>${esc(procName(x))}</b>${+x.n>1?" ×"+x.n:""}${hasPid(x)?"":" "+pidMiss}<br><span class="note">${pidTxt(x)}${LV[+x.role||0]}${x.sup?" · "+esc(x.sup):""}${x.notes?" · "+esc(x.notes):""}</span></span><span style="display:flex;gap:4px">${VIEWER?`<button class="btn sm mini" data-edlog="${x.id}">Edit</button>`:`<button class="btn sm mini p" data-lok="${x.id}">Approve</button><button class="btn sm mini" data-lno="${x.id}">Decline</button><button class="btn sm mini" data-edlog="${x.id}">Edit</button>`}</span></div>`).join("")}</div>`;
  const E=LOGB().filter(x=>x.rid===r.id&&x.status!=="pending"&&x.date>=a&&x.date<=b).sort((x,y)=>y.date.localeCompare(x.date));
  h+=`<h3>Cases</h3><div class="panel">${E.slice(0,60).map(x=>`<div class="kv"><span class="w">${fd(x.date)} <b>${esc(procName(x))}</b>${+x.n>1?" ×"+x.n:""}${x.status==="rejected"?" "+stTag("rejected"):""}<br><span class="note">${pidTxt(x)}${LV[+x.role||0]}${x.sup?" · "+esc(x.sup):""}${x.notes?" · "+esc(x.notes):""}</span></span><span class="noprint">${VIEWER?"":`<button class="btn sm mini" data-edlog="${x.id}">Edit</button>`}</span></div>`).join("")||'<p class="note">None yet.</p>'}${E.length>60?`<p class="note">Showing the latest 60 of ${E.length}. Excel has all of them.</p>`:""}</div>`;
  return h;
}

 "Mini-CEX":{max:9,band:v=>v<=3?"Below expectations":v<=6?"Meets expectations":"Above expectations",dom:["History taking","Physical examination","Professionalism","Clinical judgement","Communication","Organisation and efficiency","Overall clinical care"]},

function RULES(){const D=DU();if(!D.rules||typeof D.rules!=="object")D.rules={};const R=D.rules;R.res=R.res||{};R.sp=R.sp||{};R.fri=R.fri||{};if(!R.opts)R.opts={clinic:true,post:true};if(!Array.isArray(R.clinicDays))R.clinicDays=[0,2,4];return R}

const wdChips=(key,id,arr)=>`<span class="wdc">${WDO.filter(w=>w!==5||key!=="ruoc").map(w=>`<label><input type="checkbox" data-${key}="${id}|${w}" ${arr.includes(w)?"checked":""}><span>${WD[w]}</span></label>`).join("")}</span>`;
function learnRules(m){const R=RULES(),days=moDays(m);if(!days.some(d=>DU().days[d])){toast("That month is empty");return false}
  const cnt={};const z=(id,k,w)=>{cnt[id]=cnt[id]||{oc:{},am:{}};cnt[id][k][w]=(cnt[id][k][w]||0)+1};const sp={};
  const elig={},got={};const inc=(o,id,w)=>{o[id]=o[id]||{};o[id][w]=(o[id][w]||0)+1};
  days.forEach(d=>{const x=dutyOf(d),w=dt(d).getDay(),prev=dutyOf(addD(d,-1)).oc;if(w!==5)x.oc.forEach(id=>z(id,"oc",w));
    ST.residents.forEach(r=>{if(x.oc.includes(r.id))return;const byRule=(R.opts.clinic&&r.level<=2&&R.clinicDays.includes(w))||(R.opts.post&&w!==5&&prev.includes(r.id));if(byRule){inc(elig,r.id,w);if(x.am.includes(r.id))inc(got,r.id,w)}});
    x.am.forEach(id=>{const r=resById(id);if(!r||x.oc.includes(id))return;if(R.opts.clinic&&r.level<=2&&R.clinicDays.includes(w))return;if(R.opts.post&&w!==5&&prev.includes(id))return;z(id,"am",w)});
    if(x.sp&&w!==5){sp[w]=sp[w]||{};sp[w][x.sp]=(sp[w][x.sp]||0)+1}});
  ST.residents.forEach(r=>{const c=cnt[r.id]||{oc:{},am:{}};const o=rr(r.id);o.oc=Object.keys(c.oc).filter(w=>c.oc[w]>=2).map(Number);o.am=Object.keys(c.am).filter(w=>c.am[w]>=2).map(Number);
    const e=elig[r.id]||{},g=got[r.id]||{};o.noam=Object.keys(e).filter(w=>e[w]>=2&&!g[w]).map(Number)});
  Object.entries(sp).forEach(([w,o])=>{R.sp[w]=Object.entries(o).sort((a,b)=>b[1]-a[1])[0][0]});return true}
function genMonth(m){const R=RULES(),D=DU(),days=moDays(m),res=ST.residents,out={};
  days.forEach(d=>{const w=dt(d).getDay();out[d]={oc:w===5?[]:res.filter(r=>rr(r.id).oc.includes(w)).map(r=>r.id),am:[],sp:w===5?"":(R.sp[w]||"")}});
  days.filter(d=>dt(d).getDay()===5).forEach(f=>{const F=R.fri[f]||{oc:[],sp:""};out[f].oc=F.oc.filter(resById);out[f].sp=F.sp||"";
    F.oc.forEach(id=>{const own=rr(id).oc;for(const k of [-1,1,-2,2,-3,3]){const d=addD(f,k);if(out[d]&&own.includes(dt(d).getDay())&&out[d].oc.includes(id)){out[d].oc=out[d].oc.filter(x=>x!==id);break}}})});
  days.forEach((d,i)=>{const w=dt(d).getDay(),x=out[d],prev=i?out[days[i-1]].oc:(dutyOf(addD(d,-1)).oc);
    x.am=res.filter(r=>{if(x.oc.includes(r.id))return false;const o=rr(r.id);if(o.noam.includes(w))return false;
      return o.am.includes(w)||(R.opts.clinic&&r.level<=2&&R.clinicDays.includes(w))||(R.opts.post&&w!==5&&prev.includes(r.id))}).map(r=>r.id)});
  days.forEach(d=>{const x=out[d];if(!x.oc.length&&!x.am.length&&!x.sp)delete D.days[d];else D.days[d]=x})}

}

function icsFor(k,m){const isRes=k.startsWith("r:"),id=k.slice(2),t=today();const ev=[];const st=(d,h)=>d.replace(/-/g,"")+"T"+pad(h)+"0000";
  const add=(uidp,d,h1,d2,h2,sum,desc)=>ev.push(["BEGIN:VEVENT","UID:"+uidp+"@ent-residency","DTSTAMP:"+st(t,0),"DTSTART:"+st(d,h1),"DTEND:"+st(d2,h2),"SUMMARY:"+icsEsc(sum),desc?"DESCRIPTION:"+icsEsc(desc):"","BEGIN:VALARM","TRIGGER:-PT12H","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(sum),"END:VALARM","END:VEVENT"].filter(Boolean).join("\r\n"));
  moDays(m).forEach(d=>{const x=dutyOf(d);
    if(isRes){if(x.oc.includes(id))add("d"+d+id,d,8,addD(d,1),8,"24 duty",x.sp?"Specialist: "+x.sp:"");else if(x.am.includes(id))add("m"+d+id,d,8,d,14,"Morning duty","")}
    else if(x.sp&&x.sp.trim().toLowerCase()===id.trim().toLowerCase())add("s"+d+id.replace(/\W/g,""),d,8,addD(d,1),8,"24 duty (specialist)","")});
  if(isRes)theatreOf(id,m).forEach(([d,l])=>add("t"+d+l.id+id,d,8,d,14,"Theatre: "+l.name,l.place||""));
  if(isRes){const r=resById(id);lecSorted().filter(l=>l.date>=t&&l.presenter===id).forEach(l=>{const h=+(l.time||"12:00").split(":")[0];add("l"+l.id,l.date,h,l.date,h+1,"Lecture: "+l.title,l.ref||"")});
    examSorted().filter(e=>e.date>=t&&examFor(e,r)).forEach(e=>{const h=+(e.time||"09:00").split(":")[0];add("e"+e.id,e.date,h,e.date,h+2,"Exam: "+e.name,e.topics||"")})}
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ENT Residency//EN","CALSCALE:GREGORIAN","X-WR-CALNAME:"+icsEsc(ST.name)].concat(ev,["END:VCALENDAR"]).join("\r\n")}
const icsEsc=s=>String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1");

const enc=new TextEncoder(),dec=new TextDecoder();
const b64=buf=>{let s="";const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pass,salt){const k=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function sha(s){return b64(await crypto.subtle.digest("SHA-256",enc.encode(s)))}

function rulesText(owner){owner=(owner||"YOUR_EMAIL@example.com").trim().toLowerCase();return `rules_version = '2';
service cloud.firestore {
  match /databases/{db}/documents {
    function signedIn() { return request.auth != null && request.auth.token.email_verified == true; }
    function email() { return request.auth.token.email.lower(); }
    function lists() { return get(/databases/$(db)/documents/access/lists).data; }
    function hasLists() { return exists(/databases/$(db)/documents/access/lists); }
    function isOwner() { return signedIn() && email() == '${owner}'; }
    function isAdmin() { return isOwner() || (signedIn() && hasLists() && email() in lists().admins); }
    function isViewer() { return isAdmin() || (signedIn() && hasLists() && email() in lists().viewers); }
    function resMap() { return get(/databases/$(db)/documents/access/res).data; }
    function isRes(rid) { return isViewer() && rid is string && exists(/databases/$(db)/documents/access/res) && email() in resMap() && resMap()[email()] == rid; }
    function isTr(name) { return isViewer() && name is string && exists(/databases/$(db)/documents/access/res) && email() in resMap() && resMap()[email()] == 't:' + name; }
    function okEval() { return request.resource.data.rid is string && request.resource.data.by == email() && isTr(request.resource.data.assessor) && request.resource.data.keys().hasOnly(['rid','type','date','assessor','setting','focus','scores','strengths','improve','action','at','by']); }
    function trDecides() { return isTr(resource.data.sup) && resource.data.status == 'pending' && request.resource.data.status in ['ok','rejected'] && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status','decidedBy']); }
    function isCm() { return isViewer() && exists(/databases/$(db)/documents/access/conduct) && email() in get(/databases/$(db)/documents/access/conduct).data.members; }
    function okCond() { return request.resource.data.rid is string && request.resource.data.by == email() && request.resource.data.kind in ['penalty','award'] && request.resource.data.keys().hasOnly(['rid','kind','type','cause','date','details','extra','until','byName','by','at']); }
    function okNew() { return request.resource.data.status == 'pending' && request.resource.data.keys().hasOnly(['rid','kind','date','proc','procText','role','n','sup','notes','from','to','withRid','withDate','reason','status','at','by','pin','pfile']); }
    function okProf() { return request.resource.data.email == email() && request.resource.data.status == 'pending' && request.resource.data.keys().hasOnly(['email','name','phone','boardStart','susp','ms','status','at']); }
    match /access/lists { allow read, write: if isAdmin(); }
    match /access/res { allow read, write: if isAdmin(); }
    match /access/conduct { allow read, write: if isAdmin(); }
    match /conduct/{id} {
      allow read: if isAdmin() || isCm() || isRes(resource.data.rid);
      allow create: if isAdmin() || (isCm() && okCond());
      allow update: if isAdmin() || (isCm() && resource.data.by == email() && okCond());
      allow delete: if isAdmin() || (isCm() && resource.data.by == email());
    }
    match /program/public { allow read: if isViewer(); allow write: if isAdmin(); }
    match /program/private { allow read, write: if isAdmin(); }
    match /logs/{id} {
      allow read: if isAdmin() || isRes(resource.data.rid) || isTr(resource.data.sup);
      allow create: if isAdmin() || (isRes(request.resource.data.rid) && okNew());
      allow update: if isAdmin() || (isRes(resource.data.rid) && resource.data.status == 'pending' && request.resource.data.rid == resource.data.rid && okNew()) || trDecides();
      allow delete: if isAdmin() || (isRes(resource.data.rid) && resource.data.status == 'pending');
    }
    match /evals/{id} {
      allow read: if isAdmin() || isRes(resource.data.rid) || (isViewer() && resource.data.by == email());
      allow create: if isAdmin() || okEval();
      allow update: if isAdmin() || (resource.data.by == email() && okEval());
      allow delete: if isAdmin() || (isViewer() && resource.data.by == email());
    }
    match /profiles/{uid} {
      allow read: if isAdmin() || (signedIn() && request.auth.uid == uid);
      allow create: if isAdmin() || (signedIn() && request.auth.uid == uid && okProf());
      allow update: if isAdmin() || (signedIn() && request.auth.uid == uid && resource.data.status == 'pending' && okProf());
      allow delete: if isAdmin();
    }
    match /reqs/{id} {
      allow read: if isAdmin() || isRes(resource.data.rid);
      allow create: if isAdmin() || (isRes(request.resource.data.rid) && okNew());
      allow update: if isAdmin() || (isRes(resource.data.rid) && resource.data.status == 'pending' && request.resource.data.rid == resource.data.rid && okNew());
      allow delete: if isAdmin() || (isRes(resource.data.rid) && resource.data.status == 'pending');
    }
  }
}`}

const hasAR=s=>/[؀-ۿ]/.test(s);
function tr(s){if(LANG!=="ar"||!s)return s;const t=s.trim();if(!t||!/[A-Za-z]/.test(t))return s;
  const lead=s.slice(0,s.indexOf(t)),tail=s.slice(s.indexOf(t)+t.length);const w=x=>(x[0]===":"?"":lead)+x+tail;
  if(AR[t]!==undefined)return w(AR[t]);
  for(const [rx,f] of AR_RX){const m=t.match(rx);if(m){const r=f(...m);if(r!==t)return w(r)}}
  if(t.includes(" · ")){const p=t.split(" · ");if(p.length===2&&hasAR(p[1])&&!hasAR(p[0]))return w(p[1]);const q=p.map(x=>tr(x));if(q.some((x,i)=>x!==p[i]))return w(q.join(" · "))}
  const i=t.indexOf(": ");if(i>0){const a=t.slice(0,i),b=t.slice(i+2),ta=tr(a),tb=tr(b);if(ta!==a||tb!==b)return w(ta+": "+tb)}
  return s}
const NOTR="script,style,textarea,[data-notr]";
function trNode(n){if(n.nodeType===3){if(n.parentElement&&n.parentElement.closest(NOTR))return;const v=n.nodeValue,x=tr(v);if(x!==v)n.nodeValue=x;return}
  if(n.nodeType!==1||(n.closest(NOTR)&&!n.matches("textarea")))return;
  ["placeholder","title","aria-label"].forEach(a=>{const v=n.getAttribute(a);if(v){const x=tr(v);if(x!==v)n.setAttribute(a,x)}});
  if(n.tagName==="INPUT"&&(n.type==="button"||n.type==="submit")&&n.value){const x=tr(n.value);if(x!==n.value)n.value=x}
  const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let c;while(c=w.nextNode()){if(c.nodeType===1){["placeholder","title","aria-label"].forEach(a=>{const v=c.getAttribute(a);if(v){const x=tr(v);if(x!==v)c.setAttribute(a,x)}})}else trNode(c)}}
function initLang(){
  const sel=document.createElement("select");sel.id="lang";sel.setAttribute("aria-label","Language");sel.setAttribute("data-notr","");
  sel.innerHTML='<option value="en">English</option><option value="ar">عربي</option>';sel.value=LANG;
  sel.onchange=()=>{try{localStorage.setItem("ent-lang",sel.value)}catch(e){}location.reload()};
  document.querySelector("header.app .in").prepend(sel);
  if(LANG!=="ar")return;
  document.documentElement.lang="ar";document.documentElement.dir="rtl";
  const put=(a,b)=>a.splice(0,a.length,...b);
  put(MON,["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"]);
  put(MONL,MON.slice());
  put(DAY,["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"]);
  put(DAYS3,DAY.slice());
  put(WD,DAYS3.slice());put(TDAY,["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة"]);
  const oc=window.confirm.bind(window);window.confirm=m=>oc(tr(String(m)));
  trNode(document.body);
  new MutationObserver(ms=>ms.forEach(m=>{if(m.type==="characterData")trNode(m.target);else if(m.type==="attributes")trNode(m.target);else m.addedNodes.forEach(trNode)})).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:["placeholder","title"]});
}

/* ================= board roadmap ================= */
/* exam rules (program director, 28 Nov 2026):
   - promotion exams twice a year (March, September); first/second part and eligibility in March or October
   - R1->R2 promotion: at least 11 months of training in R1
   - First part: after passing R1; it is the gate to R3, which starts no earlier than 2 years of board time
   - R3->R4 and R4->R5: at least 11 months in that year
   - Eligibility: the session that falls at the end of training, up to 2 months before it ends
   - suspension periods push every date later */
const ROAD_DEF={promoM:[3,9],boardM:[3,10],minM:11,lead:2,
  rot:[{name:"General surgery",m:2},{name:"Pediatric surgery",m:2},{name:"Emergency",m:2},{name:"Neurosurgery",m:1},{name:"Plastic surgery",m:1},{name:"Maxillofacial surgery",m:1},{name:"ICU",m:1}]};
const monList=(v,d)=>{const a=(Array.isArray(v)?v:String(v||"").split(/[^0-9]+/)).map(Number).filter(x=>x>=1&&x<=12);return a.length?[...new Set(a)].sort((x,y)=>x-y):d};
function roadRules(){const r=ST.road&&ST.road.rules||{};return {promoM:monList(r.promoM,ROAD_DEF.promoM),boardM:monList(r.boardM,ROAD_DEF.boardM),minM:+r.minM||ROAD_DEF.minM,lead:r.lead===0?0:(+r.lead||ROAD_DEF.lead),rot:Array.isArray(r.rot)&&r.rot.length?r.rot:ROAD_DEF.rot}}
let MYPROF=null;
const addMon=(s,n)=>{const d=dt(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const dDiff=(a,b)=>Math.round((dt(b)-dt(a))/864e5);
const maxD=(...a)=>a.filter(Boolean).sort().pop();
const ym=s=>s.slice(0,7);
const fmy=s=>{if(!s)return"—";const d=dt(s);return "<span>"+MONL[d.getMonth()]+" "+d.getFullYear()+"</span>"};
/* date reached after `months` of training from `start`, pushed past every suspension in the way */
function adv(start,months,susp){let d=addMon(start,months);
  const S=(susp||[]).filter(s=>s.from&&s.to&&s.to>=start).slice().sort((a,b)=>a.from.localeCompare(b.from));
  for(const s of S){if(s.from<d)d=addD(d,dDiff(s.from<start?start:s.from,s.to)+1)}return d}
/* first exam session (the 15th of one of `months`) on or after `d` */
function sess(d,months){const x=dt(d);for(let i=0;i<48;i++){const c=new Date(x.getFullYear(),x.getMonth()+i,15);if(months.includes(c.getMonth()+1)&&iso(c)>=d)return iso(c)}return d}
function trainedMonths(bs,susp,at){if(!bs||at<bs)return 0;let days=dDiff(bs,at);
  (susp||[]).forEach(s=>{if(!s.from||!s.to)return;const a=s.from<bs?bs:s.from,b=s.to>at?at:s.to;if(b>=a)days-=dDiff(a,b)+1});return Math.max(0,days)/30.44}
const rotNameEq=(a,b)=>{a=String(a||"").toLowerCase().trim();b=String(b||"").toLowerCase().trim();return a&&b&&(a===b||a.includes(b)||b.includes(a))};
const MSHORT={promo12:"Promotion exam",part1:"First part",promo34:"Promotion exam",promo45:"Promotion exam",eligW:"Eligibility",eligO:"Eligibility",part2W:"2nd part",part2O:"2nd part"};
function roadOf(d){/* d={boardStart,susp,ms,blocks:[{n,from,to}],extDone} */
  const R=roadRules(),t=today();if(!d||!d.boardStart)return null;const bs=d.boardStart,S=(d.susp||[]).filter(s=>s.from&&s.to),M=d.ms||{};
  const got=k=>M[k]&&M[k].ok?(M[k].date||null):null,passed=k=>!!(M[k]&&M[k].ok);
  const items=[],add=(k,elig,months)=>{const a=got(k),due=a||sess(elig,months);items.push({k,due,elig,done:passed(k),date:a||""});return passed(k)&&a?a:due};

  const p12=add("promo12",adv(bs,R.minM,S),R.promoM);
  const p1=add("part1",maxD(addD(p12,1),adv(bs,R.minM,S)),R.boardM);
  const y3=maxD(adv(bs,24,S),p1);
  const p34=add("promo34",adv(y3,R.minM,S),R.promoM);const y4=maxD(adv(y3,12,S),p34);
  const p45=add("promo45",adv(y4,R.minM,S),R.promoM);const y5=maxD(adv(y4,12,S),p45);
  const end=adv(y5,12,S);

  const p2=maxD(end,addD(passed("eligW")&&got("eligW")?got("eligW"):eW,1));add("part2W",p2,R.boardM);add("part2O",p2,R.boardM);
  const NM=Object.fromEntries(MS);

  DR.forEach(r=>{if(r.from&&r.to&&!B.some(b=>rotNameEq(b.n,r.n)&&b.from<=r.to&&b.to>=r.from))B.push({n:r.n,from:r.from,to:r.to})});
  const rot=R.rot.map(x=>{const mine=B.filter(b=>rotNameEq(b.n,x.name)).sort((a,b)=>a.from.localeCompare(b.from));
    const doneM=mine.filter(b=>b.to<t).reduce((a,b)=>a+Math.max(1,Math.round((dDiff(b.from,b.to)+1)/30.44)),0);
    const said=DR.some(r=>rotNameEq(r.n,x.name)&&(!r.to||r.to<=t));const st=d.extDone||said||doneM>=x.m?"done":mine.some(b=>b.from<=t&&t<=b.to)?"now":mine.some(b=>b.from>t)?"planned":"todo";
    return {name:x.name,m:x.m,doneM:d.extDone||said?x.m:Math.min(doneM,x.m),st,blocks:mine}});
  /* month-by-month plan, one row per training year */
  const lastM=ym(items.reduce((a,i)=>i.due>a?i.due:a,end));
  const bounds=[...starts,end],rows=[[],[],[],[],[],[]];const stopM=lastM>ym(addD(end,-1))?lastM:ym(addD(end,-1));
  for(let m=ym(bs)+"-01";ym(m)<=stopM;m=addMon(m,1)){const me=addD(addMon(m,1),-1),mid=ym(m)+"-15";
    let y=0;while(y<5&&mid>=bounds[y+1])y++;
    const sp=S.find(s=>s.from<=me&&s.to>=m),bl=B.find(b=>b.from<=me&&b.to>=m),ex=items.filter(i=>ym(i.due)===ym(m));
    rows[y].push({m,label:sp?"Suspension":bl?bl.n:y===5?"":"ENT",kind:sp?"susp":bl?"rot":y===5?"aft":"ent",ex:[...new Set(ex.map(i=>MSHORT[i.k]))],exDone:ex.length>0&&ex.every(i=>i.done),past:me<t,now:m<=t&&t<=me})}
  rows[5]=rows[5].some(c=>c.ex.length)?rows[5].slice(0,rows[5].map(c=>c.ex.length>0).lastIndexOf(true)+1):[];
  return {bs,tm:trainedMonths(bs,S,t),year,suspDays:S.reduce((a,s)=>a+dDiff(s.from,s.to)+1,0),end,items,rot,rows:rows.map((cells,i)=>({y:i+1,cells})).filter(r=>r.cells.length),extDone:!!d.extDone}}
function roadData(rid){/* admin: from private rp + rot; resident: from own profile + public road.pub */
  if(!VIEWER){const r=resById(rid);if(!r)return null;const p=ST.rp[rid]||{};
    return {boardStart:p.boardStart,susp:p.susp,ms:p.ms,rots:p.rots,extDone:p.extDone,blocks:blocksOf(rid).map(b=>({n:blkName(b),from:b.from,to:b.to}))}}
  const pub=(ST.road&&ST.road.pub||{})[rid]||{};const P=MYPROF||{};
  return {boardStart:P.boardStart,susp:P.susp,ms:P.ms,rots:P.rots,extDone:pub.done,blocks:pub.b||[]}}
/* admin app publishes each resident's rotation blocks so residents can see their own plan */
function roadPub(){const pub={};ST.residents.forEach(r=>{const p=ST.rp[r.id]||{};pub[r.id]={done:!!p.extDone,b:blocksOf(r.id).map(b=>({n:blkName(b),from:b.from,to:b.to}))}});
  ST.road=Object.assign({},ST.road||{},{pub})}
const RST={done:["Done","#1F7A4D"],late:["Not recorded yet","#B42318"],soon:["Coming up","#B54708"],next:["Expected","#475467"],now:["Now","#1F6FB2"],planned:["Planned","#475467"],todo:["Not planned yet","#B42318"]};
const rBadge=s=>`<span class="tag" style="background:${RST[s][1]};color:#fff">${RST[s][0]}</span>`;
const YL=["R1","R2","R3","R4","R5","After training"];
function roadGrid(x){return `<div class="rmap">${x.rows.map(r=>`<div class="rm-y"><div class="rm-h">${YL[r.y-1]==="After training"?"<span>After training</span>":YL[r.y-1]}</div><div class="rm-row">${r.cells.map(c=>{const d=dt(c.m);
  return `<div class="rm-c ${c.kind}${c.ex.length?" ex":""}${c.exDone?" exd":""}${c.past?" past":""}${c.now?" now":""}"><div class="rm-m" dir="ltr">${d.getMonth()+1}/${d.getFullYear()}</div><div class="rm-l">${c.ex.length?c.ex.map(e=>`<b>${e}</b>`).join("<br>"):`<span>${esc(c.label)}</span>`}</div></div>`}).join("")}</div></div>`).join("")}
  <div class="rm-key"><span class="rm-c ent"></span><span>ENT</span> <span class="rm-c rot"></span><span>Rotation</span> <span class="rm-c ex"></span><span>Exam</span> <span class="rm-c susp"></span><span>Suspension</span></div></div>`}
function roadHtml(x,full){if(!x)return `<div class="panel note">${VIEWER?"Your board start date is not recorded yet. Ask the program director.":"Add the board start date in the board record to see the roadmap."}</div>`;
  let h=`<div class="panel"><div class="kv"><span>Board start</span><span>${fdy(x.bs)}</span></div>
   <div class="kv"><span>Training so far</span><span>${Math.floor(x.tm)} <span>months</span>${x.year<6?" · R"+x.year:""}</span></div>
   ${x.suspDays?`<div class="kv"><span>Suspension periods</span><span>${x.suspDays} <span>days</span></span></div>`:""}
   <div class="kv"><span>Expected end of training</span><span><b>${fdy(x.end)}</b></span></div></div>
  <h3>Month by month</h3>${roadGrid(x)}
  <h3>Exams and promotions</h3><div class="panel">${x.items.map(i=>`<div class="kv"><span class="w">${i.name}<br><span class="note">${i.done?"<span>Passed</span> "+(i.date?fdy(i.date):""):"<span>Expected session</span> "+fmy(i.due)}</span></span><span>${rBadge(i.st)}</span></div>`).join("")}</div>
  <h3>External rotations</h3><div class="panel">${x.rot.map(r=>`<div class="kv"><span class="w">${esc(r.name)} <span class="note">(${r.doneM}/${r.m} <span>months</span>)</span>${r.blocks.length&&!x.extDone?`<br><span class="note">${r.blocks.map(b=>fd(b.from)+" – "+fdy(b.to)).join(" · ")}</span>`:""}</span><span>${rBadge(r.st)}</span></div>`).join("")}</div>`;
  if(full)h+=`<p class="note">Dates are worked out from the board start date, the exams already passed and any suspension periods. Promotion exams are in March and September; First part, Eligibility and 2nd part are in March and October. The official exam dates decide.</p>`;
  return h}
function vRoad(){
  if(VIEWER){if(!MYRID)return `<h2>My board roadmap</h2><div class="empty">Your email is not linked to your name yet. Ask the program director to link it.</div>`;
    return `<h2>My board roadmap</h2>`+roadHtml(roadOf(roadData(MYRID)),true)}
  const rows=sortedRes().map(r=>{const x=roadOf(roadData(r.id));if(!x)return `<div class="kv" data-prof="${r.id}" style="cursor:pointer"><span class="w"><b>${esc(r.name)}</b> <span class="lvl">R${r.level}</span></span><span class="note">No board start date</span></div>`;
    const nx=x.items.find(i=>i.st!=="done"),late=x.items.filter(i=>i.st==="late").length,rl=x.rot.filter(o=>o.st!=="done").length;
    return `<div class="kv" data-prof="${r.id}" style="cursor:pointer"><span class="w"><b>${esc(r.name)}</b> <span class="lvl">R${r.level}</span><br><span class="note">${Math.floor(x.tm)} <span>months</span> · <span>Expected end of training</span> ${fdy(x.end)}</span>${nx?`<br><span class="note"><span>Next</span> <span>${nx.name}</span> ${fmy(nx.due)}</span>`:""}${rl?`<br><span class="note">${rl} <span>rotations left</span></span>`:""}</span><span>${late?rBadge("late"):""}</span></div>`}).join("");
  return `<h2>Board roadmaps</h2><p class="note">Open a resident to see their full roadmap. Change the exam months and the rotation list in Settings.</p><div class="panel">${rows||'<p class="note">No residents yet.</p>'}</div>`}
function roadRulesPanel(){const R=roadRules();
  return `<h3>Board roadmap</h3><div class="panel noprint"><p class="note">The roadmap of each resident is worked out from these rules, their board start date, their exams and their suspension periods.</p>
  <div class="row"><div style="flex:1;min-width:150px">${field("Promotion exam months",inp("rd_pm",R.promoM.join(", "),'dir="ltr"'))}</div><div style="flex:1;min-width:150px">${field("First part, Eligibility and 2nd part months",inp("rd_bm",R.boardM.join(", "),'dir="ltr"'))}</div></div>
  <div class="row"><div style="flex:1;min-width:150px">${field("Months in the year before a promotion exam",inp("rd_min",R.minM,'type="number" min="6" max="12"'))}</div><div style="flex:1;min-width:150px">${field("Eligibility: months before the end of training",inp("rd_lead",R.lead,'type="number" min="0" max="6"'))}</div></div>
  ${field("External rotations, one per line: name | months",`<textarea class="f2" id="rd_rot" rows="7" dir="ltr">${esc(R.rot.map(x=>x.name+" | "+x.m).join("\n"))}</textarea>`)}
  <button class="btn p" id="rd_save">Save roadmap settings</button></div>`}
function bindRoad(){const b=$("#rd_save");if(b)b.onclick=()=>{
  const rot=$("#rd_rot").value.split("\n").map(l=>l.split("|")).map(([n,m])=>({name:(n||"").trim(),m:Math.max(1,+(m||"").trim()||1)})).filter(x=>x.name);
  ST.road=Object.assign({},ST.road||{},{rules:{promoM:monList($("#rd_pm").value,ROAD_DEF.promoM),boardM:monList($("#rd_bm").value,ROAD_DEF.boardM),minM:Math.min(12,Math.max(6,+$("#rd_min").value||11)),lead:Math.min(6,Math.max(0,+$("#rd_lead").value||0)),rot}});seedRotTypes();save();toast("Saved");rerender()}}
/* names of residents with no linked account yet, so a new sign-up can pick who they are (program/names, readable by any signed-in user) */
function syncNames(){if(typeof LIVE==="undefined"||!LIVE||LIVE.role!=="admin")return;const linked=new Set(Object.values(WHO()||{}).filter(v=>String(v).startsWith("r:")).map(v=>v.slice(2)));const L=sortedRes().filter(r=>!linked.has(r.id)).map(r=>({id:r.id,name:r.name,level:r.level})),j=JSON.stringify([L,roadRules().rot]);if(j===LIVE.namesJ)return;LIVE.namesJ=j;
  LIVE.fs.setDoc(LIVE.fs.doc(LIVE.db,"program","names"),{list:L,rot:roadRules().rot}).catch(e=>{LIVE.namesJ="";console.warn("names",e.code)})}
/* make sure every required rotation is in the rotation list, so it can be assigned by name */
function seedRotTypes(){if(VIEWER)return;roadRules().rot.forEach((x,i)=>{if(!ST.rotTypes.some(t=>rotNameEq(t.name,x.name)))ST.rotTypes.push({id:uid(),name:x.name,color:PALETTE[(ST.rotTypes.length+i)%PALETTE.length]})})}
/* keep the resident's own profile document (which they can read) in step with the admin's edits */
async function syncProfDoc(rid){if(!LIVE||LIVE.role!=="admin")return;const P=PROFS().find(x=>x.rid===rid);if(!P)return;const p=ST.rp[rid]||{};
  try{await LIVE.fs.updateDoc(LIVE.fs.doc(LIVE.db,"profiles",P.id),{boardStart:p.boardStart||"",susp:p.susp||[],ms:p.ms||{},rots:p.rots||[]})}catch(e){console.warn("prof sync",e.code)}}

initLang();
{const fb=$("#pinforgot");if(fb)fb.onclick=async()=>{
  if(!(typeof LIVE!=="undefined"&&LIVE&&LIVE.au)){toast("Ask the program director to reset this device");return}
  if(!confirm("Sign out and remove the PIN from this device? Sign in again with your email and password, then set a new PIN."))return;
  ST.pinHash=null;ST.pinSalt=null;try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}
  $("#lock").classList.remove("open");try{await LIVE.au.signOut(LIVE.auth)}catch(e){location.reload()}}}
/* ================= notifications bell ================= */
const L2=(en,ar)=>LANG==="ar"?ar:en;
const ARD=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const nDay=d=>{const x=dt(d);return (LANG==="ar"?ARD[x.getDay()]:DAYS3[x.getDay()])+" "+x.getDate()+"/"+(x.getMonth()+1)};
function mySnap(){const rid=MYRID,r=resById(rid);if(!r)return null;const t=today(),end=addD(t,62),S={};
  Object.entries(DU().days).forEach(([d,x])=>{if(d<t||d>end)return;if((x.oc||[]).includes(rid))S["duty:"+d]=[d,"24"];else if((x.am||[]).includes(rid))S["duty:"+d]=[d,"am"]});
  for(let i=0;i<63;i++){const d=addD(t,i);TH().lists.filter(l=>+l.day===tIdx(d)).forEach(l=>{if(tAssigned(d,l.id).includes(rid))S["th:"+d+l.id]=[d,l.name]})}
  ST.lectures.forEach(l=>{if(l.presenter===rid&&l.date>=t)S["lec:"+l.id]=[l.date,(l.title||"")+"|"+(l.time||"")]});
  ST.exams.forEach(e=>{const ys=exYears(e);if(e.date>=t&&(!ys||ys.includes(r.level)))S["ex:"+e.id]=[e.date,e.name]});
  REQB().forEach(q=>{if(q.rid===rid&&(q.status==="ok"||q.status==="rejected"))S["req:"+q.id]=["",q.kind+"|"+q.status+"|"+(q.from||"")];if(q.withRid===rid&&q.status==="ok")S["sw:"+q.id]=["","swap|ok|"+(q.from||"")]});
  CONDB().forEach(c=>{if(c.rid===rid)S["cd:"+c.id]=["",c.kind]});
  return S}
const NK=()=>"ent-nseen-"+MYRID;
function myNotes(){
  if(!VIEWER)return [...(pendN().reqs?[{tab:"reqs",txt:L2(pendN().reqs+" request(s) waiting for you",pendN().reqs+" طلب بانتظارك")}]:[]),...(pendN().log?[{tab:"log",txt:L2(pendN().log+" logbook case(s) waiting for approval",pendN().log+" حالة لوق بوك بانتظار الموافقة")}]:[]),...(pendN().people?[{tab:"people",txt:L2(pendN().people+" new registration(s) to review",pendN().people+" تسجيل جديد بانتظار المراجعة")}]:[])];
  if(MYTR){const n=pendN().log;return n?[{tab:"log",txt:L2(n+" case(s) waiting for your approval",n+" حالة بانتظار موافقتك")}]:[]}
  if(!MYRID)return [];
  const ready=!LIVE||(CCOND!==null&&CREQS!==null);const S=mySnap();if(!S)return [];
  let O=null;try{O=JSON.parse(localStorage.getItem(NK())||"null")}catch(e){}
  if(!O){if(ready)try{localStorage.setItem(NK(),JSON.stringify(S))}catch(e){}return []}
  const t=today(),out=[];
  Object.keys(Object.assign({},O,S)).sort((a,b)=>((S[a]||O[a])[0]).localeCompare((S[b]||O[b])[0])).forEach(k=>{const n=S[k],o=O[k];if(JSON.stringify(n)===JSON.stringify(o))return;if(o&&!n&&o[0]&&o[0]<t)return;
    const ty=k.split(":")[0],d=(n||o)[0],sh=v=>v==="24"?L2("24 duty","مناوبة 24"):L2("morning duty","دوام صباحي");
    if(ty==="duty")out.push({tab:"mine",txt:n&&!o?L2(`${nDay(d)}: you now have ${sh(n[1])}`,`${nDay(d)}: صار عندك ${sh(n[1])}`):o&&!n?L2(`${nDay(d)}: your ${sh(o[1])} was removed`,`${nDay(d)}: انشالت ${sh(o[1])}`):L2(`${nDay(d)}: changed to ${sh(n[1])}`,`${nDay(d)}: صار عندك ${sh(n[1])} بدل ${sh(o[1])}`)});
    else if(ty==="th")out.push({tab:"theatre",txt:n?L2(`${nDay(d)}: you are on the theatre list (${n[1]})`,`${nDay(d)}: صار عندك عمليات (${n[1]})`):L2(`${nDay(d)}: removed from theatre`,`${nDay(d)}: انشلت من العمليات`)});
    else if(ty==="lec"){const ti=(n||o)[1].split("|")[0];out.push({tab:"lectures",txt:n?L2(`Your lecture "${ti}" is on ${nDay(n[0])}${o?" (new date)":""}`,`محاضرتك "${ti}" يوم ${nDay(n[0])}${o?" (موعد جديد)":""}`):L2(`Your lecture "${ti}" was cancelled or moved`,`محاضرتك "${ti}" انلغت أو انتقلت`)})}
    else if(ty==="ex")out.push({tab:"exams",txt:n?L2(`Exam "${n[1]}" on ${nDay(n[0])}${o?" (new date)":""}`,`امتحان "${n[1]}" يوم ${nDay(n[0])}${o?" (موعد جديد)":""}`):L2(`Exam "${o[1]}" was cancelled`,`امتحان "${o[1]}" انلغى`)});
    else if((ty==="req"||ty==="sw")&&n){const [kind,st,frm]=n[1].split("|");out.push({tab:"reqs",txt:ty==="sw"?L2(`A duty swap with you on ${nDay(frm)} was approved`,`تبديل مناوبة معك يوم ${nDay(frm)} انقبل`):L2(`Your ${kind==="leave"?"leave":"swap"} request${frm?" for "+nDay(frm):""} was ${st==="ok"?"approved":"declined"}`,`${kind==="leave"?"طلب الإجازة":"طلب التبديل"} تبعك${frm?" ليوم "+nDay(frm):""} ${st==="ok"?"انقبل":"انرفض"}`)})}
    else if(ty==="cd"&&n&&!o)out.push({tab:"conduct",txt:n[1]==="award"?L2("You received a new award 🎉","انسجلت لك مكافأة جديدة 🎉"):L2("New record from the program committee","سجل جديد من لجنة البرنامج")})});
  return out}
function drawBell(){const b=$("#bell");if(!b)return;const n=myNotes().length;b.querySelector(".bn").textContent=n>9?"9+":n;b.querySelector(".bn").style.display=n?"":"none"}
function openBell(){const N=myNotes();
  openSheet(`<h3>${L2("Notifications","الإشعارات")}</h3>${N.length?`<div class="panel">${N.map((x,i)=>`<div class="kv" data-nt="${x.tab}" style="cursor:pointer"><span class="w">${esc(x.txt)}</span><span>›</span></div>`).join("")}</div>`:`<p class="note" data-notr>${L2("No new notifications.","ما في إشعارات جديدة.")}</p>`}<div class="row" style="margin-top:12px"><button class="btn" id="bclose" data-notr>${L2("Close","إغلاق")}</button></div>`);
  if(MYRID){const S=mySnap();if(S)try{localStorage.setItem(NK(),JSON.stringify(S))}catch(e){}}
  const fin=()=>{closeSheet();drawBell()};
  $("#bclose").onclick=fin;$$("[data-nt]").forEach(e=>e.onclick=()=>{closeSheet();go(e.dataset.nt)});drawBell()}
function initBell(){const b=document.createElement("button");b.id="bell";b.type="button";b.setAttribute("aria-label","Notifications");b.setAttribute("data-notr","");b.innerHTML='🔔<span class="bn" style="display:none">0</span>';b.onclick=openBell;
  document.querySelector("header.app .in").prepend(b)}
initBell();

start();
