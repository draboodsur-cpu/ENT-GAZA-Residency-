<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#24324A">
<title>ENT Residency Program</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F2F4F6;--surface:#FFFFFF;--ink:#1C2536;--muted:#5C6676;--line:#D8DDE4;--brand:#24324A;--on-brand:#fff;--act:#3B5BDB;--act-soft:#E6EBFB;
--l1:#E9EEF3;--l1t:#5C6676;--l2:#CFE5DA;--l2t:#245A44;--l3:#6DB493;--l3t:#0F2E22;--l4:#1F6B4E;--l4t:#FFFFFF;
--ent:#DCE6F7;--sub:#D6EEE3;--ext:#F6E5CF;--res:#EADFF5;--chief:#F3D6D6;--warn:#B45309;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10151D;--surface:#171E29;--ink:#E3E8EF;--muted:#98A2B1;--line:#2A3444;--brand:#9DB3E0;--on-brand:#0E1626;--act:#8EA6F2;--act-soft:#1E2A47;
--l1:#212A37;--l1t:#98A2B1;--l2:#1E3B30;--l2t:#A9D9C1;--l3:#2F7A5A;--l3t:#E8FFF4;--l4:#62C79A;--l4t:#0B2219;
--ent:#22304A;--sub:#1E3A30;--ext:#3D3020;--res:#33284A;--chief:#43262A;--warn:#F0A44B;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header.app{background:var(--brand);color:var(--on-brand);padding:18px 16px 0}
header.app .in{max-width:980px;margin:0 auto}
header.app h1{margin:0;font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
header.app p{margin:2px 0 12px;opacity:.85;font-size:.9rem}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:980px;margin:0 auto}
nav.tabs button{flex:none;border:0;background:none;color:inherit;opacity:.75;padding:10px 12px 12px;font-weight:600;border-bottom:3px solid transparent}
nav.tabs button[aria-selected=true]{opacity:1;border-bottom-color:currentColor}
main{max-width:980px;margin:0 auto;padding:18px 16px 80px}
h2{font-size:1.15rem;margin:26px 0 10px}h2:first-child{margin-top:0}
h3{font-size:1rem;margin:18px 0 8px}
.lead{color:var(--muted);margin:-4px 0 14px;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:600;font-size:.9rem}
.btn.p{background:var(--act);border-color:var(--act);color:#fff}
@media (prefers-color-scheme:dark){.btn.p{color:#0E1626}}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn.d{color:#B42318}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.86rem;color:var(--muted)}
.chips button[aria-pressed=true]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
/* this week */
.session{display:grid;grid-template-columns:120px 1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.session .date{background:var(--brand);color:var(--on-brand);padding:14px;display:flex;flex-direction:column;justify-content:center}
.session .date b{font-size:2rem;line-height:1}.session .date span{font-size:.85rem;opacity:.85}
.session ol{list-style:none;margin:0;padding:6px 14px}
.session li{padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.session li:first-child{border-top:0}
.session .tm{color:var(--muted);font-size:.85rem;padding-top:1px;min-width:46px}
.session .what{font-weight:600}.session .who{grid-column:2;color:var(--muted);font-size:.88rem}
.session li.quiz .what{color:var(--warn)}
@media (max-width:520px){.session{grid-template-columns:1fr}.session .date{flex-direction:row;gap:10px;align-items:baseline}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem}.kv:first-of-type{border-top:0}
.kv span:first-child{font-weight:600;white-space:nowrap}.kv span:last-child{color:var(--muted);text-align:right}
/* lectures */
.block{margin-bottom:18px}
.block .bh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.block .bh h3{margin:0}.block .bh small{color:var(--muted)}
.lec{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.lec:first-child{border-top:0}
.lec .d{font-weight:600;font-size:.88rem}.lec .d small{display:block;color:var(--muted);font-weight:400}
.lec .t{font-weight:600}.lec .s{font-size:.86rem;color:var(--muted);margin-top:2px}
.lec select{font-size:.82rem;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--surface);max-width:180px}
.lec.special .t{color:var(--warn)}
.lec.past{opacity:.55}
.lec .skip{float:right}
/* matrix */
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.84rem;margin:0 0 12px}
.legend i{display:inline-flex;width:22px;height:22px;border-radius:5px;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:.78rem;margin-right:5px;vertical-align:middle}
table.mx{width:100%;border-collapse:separate;border-spacing:0 3px;font-size:.9rem}
table.mx th{font-size:.8rem;color:var(--muted);font-weight:600;text-align:center;padding:4px}
table.mx th:first-child{text-align:left}
table.mx td{padding:0}
table.mx td.p{padding:6px 8px 6px 0;font-weight:500}
table.mx td.c{width:46px}
table.mx td.c i{display:flex;height:30px;margin:0 2px;border-radius:5px;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:.8rem}
table.mx td.tg{width:58px;text-align:right;color:var(--muted);font-size:.85rem;padding-right:4px}
table.mx tr.grp td{padding:14px 0 2px;font-weight:700;font-size:.92rem}
table.mx .dim{opacity:.28}
.L1{background:var(--l1);color:var(--l1t)}.L2{background:var(--l2);color:var(--l2t)}.L3{background:var(--l3);color:var(--l3t)}.L4{background:var(--l4);color:var(--l4t)}
/* rotations */
.rgrid{overflow-x:auto}
table.rt{border-collapse:separate;border-spacing:2px;font-size:.78rem;min-width:760px;width:100%;table-layout:fixed}
table.rt th{color:var(--muted);font-weight:600;padding:4px;text-align:center}
table.rt th.n{text-align:left;width:130px;font-size:.86rem;color:var(--ink)}
table.rt td{padding:6px 4px;border-radius:5px;text-align:center;line-height:1.2;vertical-align:middle}
.c-none{background:transparent;color:var(--muted)}.c-ent{background:var(--ent)}.c-sub{background:var(--sub)}.c-ext{background:var(--ext)}.c-res{background:var(--res)}.c-chief{background:var(--chief)}
.plan .yr{margin-bottom:14px}
.bar{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar div{padding:8px 6px;font-size:.8rem;line-height:1.25;border-right:2px solid var(--surface)}
.bar div:last-child{border-right:0}
.bar small{display:block;opacity:.7}
/* lists */
.list .it{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it .m{flex:1;min-width:0}.list .it .m b{display:block}.list .it .m small{color:var(--muted)}
.lvl{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;border-radius:6px;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:.82rem}
label.f{display:block;margin-bottom:10px}label.f span{display:block;font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:3px}
label.f input,label.f select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:9px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;font-size:.9rem}
.toast.show{opacity:1}
.note{font-size:.85rem;color:var(--muted)}
.quiz{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.quiz:first-child{border-top:0}
.quiz .t{font-weight:600}.quiz .s{font-size:.86rem;color:var(--muted)}
.tag{display:inline-block;font-size:.74rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--act-soft);color:var(--act);margin-left:6px;vertical-align:1px}
.res-card{border-top:1px solid var(--line);padding:12px 0}.res-card:first-child{border-top:0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:16px 16px 22px}
.sheet h3{margin:0 0 4px}
.st-held{color:#1F7A4D;font-weight:700}.st-cancel{color:#B42318;font-weight:700}.st-none{color:var(--muted)}
.attl label{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.attl label:first-child{border-top:0}
.attl input[type=checkbox]{width:20px;height:20px}
.attl input[type=number]{width:80px;margin-left:auto;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin:8px 0 12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:7px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--on-brand)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpis div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpis b{display:block;font-size:1.5rem;line-height:1.2}.kpis span{font-size:.8rem;color:var(--muted)}
table.rep{width:100%;border-collapse:collapse;font-size:.84rem}
table.rep th,table.rep td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
table.rep th{color:var(--muted);font-weight:600;font-size:.78rem;background:var(--bg)}
table.rep td.n{text-align:center}
.rep-wrap{overflow-x:auto}
.lock{position:fixed;inset:0;z-index:80;background:var(--brand);color:var(--on-brand);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center}
.lock.open{display:flex}
.dots{display:flex;gap:12px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid currentColor}.dots i.f{background:currentColor}
.pad{display:grid;grid-template-columns:repeat(3,70px);gap:12px}
.pad button{height:62px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:inherit;font-size:1.4rem;font-weight:600}
.gate{max-width:440px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.gate h2{margin-top:0}
.viewer-tag{display:inline-block;margin-left:8px;font-size:.75rem;background:rgba(255,255,255,.2);padding:1px 8px;border-radius:999px;vertical-align:3px}
@media print{.print-only{display:block!important}table.duty tr{break-inside:avoid}header.app nav,.noprint,.btn,.toast,.scrim,.lock{display:none!important}.kpis div{border-color:#bbb}table.rep{font-size:10.5pt}table.rep th{background:#eee}h2{break-after:avoid}.panel{break-inside:auto}header.app{background:none;color:#000}body{background:#fff}.panel{border-color:#bbb}main{padding:0}}
</style>
<style>
.st-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.8rem;font-weight:600;cursor:pointer}
.st-btn.done[aria-pressed=true]{background:#1F7A4D;border-color:#1F7A4D;color:#fff}
.st-btn.not[aria-pressed=true]{background:#B42318;border-color:#B42318;color:#fff}
.badge{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.b-done{background:#E3F4EA;color:#1F7A4D}.b-not{background:#FDECEC;color:#B42318}.b-none{background:var(--bg);color:var(--muted)}
.lrow{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}.lrow .tm{font-weight:700;font-size:.9rem}.lrow .tt{font-weight:600}
.lrow .meta{font-size:.84rem;color:var(--muted)}.lrow .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dayhead{font-weight:700;margin:16px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.prog{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;display:flex;margin:6px 0}
.prog i{display:block;height:100%}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
table.tl{border-collapse:separate;border-spacing:2px;font-size:.78rem;min-width:100%}
table.tl th{font-weight:600;color:var(--muted);text-align:center;padding:4px}
table.tl th.n{text-align:left;color:var(--ink);white-space:nowrap;cursor:pointer}
table.tl td{border-radius:5px;text-align:center;padding:6px 4px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
table.tl td.e{background:var(--bg)}
.pass{color:#1F7A4D;font-weight:700}.fail{color:#B42318;font-weight:700}
.frame-body{white-space:pre-wrap;font-size:.92rem}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{font-size:.78rem;padding:3px 9px}
select.f2,input.f2,textarea.f2{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
</style>
</head>
<body>
<header class="app"><div class="in"><h1 id="pname">ENT Residency Program</h1><p id="psub"></p></div>
<nav class="tabs" role="tablist">
 <button data-t="week">This week</button><button data-t="lectures">Lectures</button><button data-t="exams">Exams</button><button data-t="theatre">Theatre</button><button data-t="duty">Duty roster</button><button data-t="rot">Rotations</button><button data-t="people">Residents</button><button data-t="report">Reports</button><button data-t="ops">Operative levels</button><button data-t="frame">Framework</button><button data-t="settings">Settings</button>
</nav></header>
<main id="view"></main>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="lock" id="lock"><h2 id="lockT" style="margin:0">Enter PIN</h2><div class="dots" id="dots"></div><div id="lerr" style="min-height:1.3em"></div><div class="pad" id="pad"></div></div>
<div class="toast" id="toast"></div>
<script>

1:[["ENT core: wards, clinics, emergency",6,"ent"],["General surgery",2,"ext"],["Anaesthesia and ICU",2,"ext"],["Emergency medicine",1,"ext"],["Audiology and vestibular unit",1,"sub"]],

/* levels: 1 observe, 2 assist, 3 perform supervised, 4 independent. target = indicative minimum performed (S or I) by graduation */
const PROCEDURES=[
 ["Emergency and general",[
  ["Microsuction and aural toilet",[3,4,4,4,4],50],
  ["Removal of foreign body: ear and nose",[3,4,4,4,4],20],
  ["Nasal cautery and packing",[4,4,4,4,4],30],
  ["Drainage of peritonsillar abscess",[3,4,4,4,4],15],
  ["Incision and drainage of neck abscess",[2,3,4,4,4],10],
  ["Elective tracheostomy",[2,3,3,4,4],20],

function old_slotsRaw(){
  const blocks=CURRICULUM[ST.cycle],out=[];
  blocks.forEach((b,bi)=>{
    b.topics.forEach((t,ti)=>out.push({kind:"lec",bi,ti,block:b,topic:t,quiz:ti===4}));
    if(bi===3)out.push({kind:"exam",title:"Mid-year assessment",desc:"OSCE stations and viva for all residents on blocks 1–4. Supervisor mid-year meetings this week."});
    if(bi===5)out.push({kind:"exam",title:"Mock board exams",desc:"R2: Part I mock (basic sciences). R5: Part II mock (written paper and viva). Others: progress test, 60 MCQs."});
    if(bi===7)out.push({kind:"exam",title:"End-of-year exam",desc:"100 MCQs plus OSCE for all residents. Followed by annual reviews and logbook sign-off."});
  });
  let d=ST.start;const skips=new Set(ST.skips);let wk=0;
  for(const s of out){while(skips.has(d))d=addD(d,7);s.date=d;s.week=++wk;s.key=ST.cycle+"|"+(s.kind==="lec"?s.bi+"-"+s.ti:s.title);d=addD(d,7)}
  old_assign(out);return out;
}
function old_rr(pool,i){return pool.length?pool[i%pool.length]:null}
function old_assign(out){
  const all=old_sorted();let ci=0,li=0,ji=0,mi=0;
  for(const s of out){
    s.items=[];
    if(s.kind!=="lec"){s.items.push({tm:ST.times[0],what:s.title,who:s.desc,cls:"quiz"});continue}
    const lecN=s.bi*5+s.ti;
    let first;
    if(lecN%4===0){const pool=all.filter(r=>r.level>=3);first={role:"jc",what:"Journal club",who:old_rr(pool.length?pool:all,ji++)}}
    else if(lecN%4===2){const pool=all.filter(r=>r.level>=4);first={role:"mm",what:"Morbidity and mortality meeting",who:old_rr(pool.length?pool:all,mi++)}}
    else first={role:"case",what:"Case presentation",who:old_rr(all,ci++)};
    const [lo,hi]=s.block.lead;let pool=all.filter(r=>r.level>=lo&&r.level<=hi);if(!pool.length)pool=all;
    const lec={role:"lec",what:s.topic,who:old_rr(pool,li++),ref:s.block.ref};
    [first,lec].forEach(it=>{const ov=ST.override[s.key+"|"+it.role];if(ov&&resById(ov))it.who=resById(ov)});
    s.items.push({tm:ST.times[0],what:first.what,who:first.who?first.who.name+" (R"+first.who.level+")":"Assign a resident",role:first.role,rid:first.who&&first.who.id});
    s.items.push({tm:ST.times[1],what:lec.what,who:(lec.who?"Presenter: "+lec.who.name+" (R"+lec.who.level+"), consultant facilitator":"Consultant lecture")+"<br><span class='note'>Reading: "+esc(lec.ref)+"</span>",role:"lec",rid:lec.who&&lec.who.id,raw:true});
    if(s.quiz)s.items.push({tm:ST.times[2],what:"Block quiz: "+s.block.name,who:"40 MCQs on this block, 45 minutes, reviewed together afterwards",cls:"quiz"});
    else s.items.push({tm:ST.times[2],what:lecN%2?"Image and audiogram review":"Instrument and OSCE station practice",who:"Seniors lead, juniors answer"});
  }
}

function old_applyEdits(out){
  const E=ST.sess||{};
  out.forEach(s=>{const o=E[s.key];if(!o)return;
    if(o.date)s.date=o.date;
    if(o.topic){if(s.kind==="lec"){s.topic=o.topic;s.items[1].what=o.topic}else{s.title=o.topic;s.items[0].what=o.topic}}
    if(o.desc!=null&&s.kind==="exam"){s.desc=o.desc;s.items[0].who=o.desc}
    if(s.kind==="lec"){
      if(o.firstType)s.items[0].what=o.firstType;
      if(o.quiz!=null&&o.quiz!==s.quiz){s.quiz=o.quiz;s.items[2]=o.quiz?{tm:ST.times[2],what:"Quiz: "+s.block.name,who:"MCQs on this block, reviewed together afterwards",cls:"quiz"}:{tm:ST.times[2],what:"Image and audiogram review",who:"Seniors lead, juniors answer"}}
      if(o.third&&!s.quiz)s.items[2]={tm:ST.times[2],what:o.third,who:""};
    }
    if(o.note)s.note=o.note;
    if(o.hidden)s.hidden=true;
  });
  (ST.extra||[]).forEach(x=>{const pr=x.presenter&&resById(x.presenter);
    out.push({kind:"extra",key:"X|"+x.id,id:x.id,date:x.date,week:"",title:x.title,desc:x.desc||"",quiz:!!x.quiz,note:x.note||"",

  return out.filter(s=>!s.hidden).sort((a,b)=>a.date.localeCompare(b.date)||(a.week||99)-(b.week||99));
}

function promote(r,grad){const p=rpOf(r);p.hist=p.hist||[];p.hist.push({level:r.level,from:p.since||"",to:today()});p.since=today();
  if(grad){ST.graduates.push({id:r.id,name:r.name,level:r.level,graduated:today(),boardStart:p.boardStart});ST.residents=ST.residents.filter(x=>x.id!==r.id)}else r.level++}

/* ================= theatre rota ================= */
const TDAY=["Saturday","Sunday","Monday","Tuesday","Wednesday","Thursday","Friday"];
let TWK=null;
function satOf(d){const x=dt(d);x.setDate(x.getDate()-((x.getDay()+1)%7));return iso(x)}
function TH(){ST.theatre=ST.theatre||{lists:[],weeks:{}};ST.theatre.lists=ST.theatre.lists||[];ST.theatre.weeks=ST.theatre.weeks||{};return ST.theatre}

  const T=TH();if(!TWK)TWK=satOf(today());const W=T.weeks[TWK]||{};
  let h=`<h2>Theatre rota</h2><div class="row noprint" style="margin-bottom:12px"><button class="btn" id="tprev">‹</button><b style="flex:1;text-align:center">${fd(TWK)} – ${fdy(addD(TWK,6))}</b><button class="btn" id="tnext">›</button></div>

function theatreCount(id,a,b){const T=TH();let n=0;Object.entries(T.weeks).forEach(([wk,W])=>{T.lists.forEach(l=>{const d=addD(wk,+l.day);if(d>=a&&d<=b&&(W[l.id]||[]).includes(id))n++})});return n}

/* ================= duty roster (monthly) ================= */
let DMO=null;
const MONL=["January","February","March","April","May","June","July","August","September","October","November","December"];
function DU(){if(!ST.duty||typeof ST.duty!=="object")ST.duty={days:{}};if(!ST.duty.days||typeof ST.duty.days!=="object")ST.duty.days={};return ST.duty}
const moDays=m=>{const [y,mo]=m.split("-").map(Number);const n=new Date(y,mo,0).getDate();return Array.from({length:n},(_,i)=>m+"-"+pad(i+1))};
const moName=m=>{const [y,mo]=m.split("-").map(Number);return MONL[mo-1]+" "+y};
const addMo=(m,k)=>{const [y,mo]=m.split("-").map(Number);const d=new Date(y,mo-1+k,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)};
const dutyOf=d=>{const x=DU().days[d]||{};return {am:x.am||[],oc:x.oc||[],sp:x.sp||""}};
const dutyNames=ids=>(ids||[]).map(resById).filter(Boolean);
const dShort=d=>{const x=dt(d);return DAY[x.getDay()].slice(0,3)+" "+x.getDate()};
const isFri=d=>dt(d).getDay()===5;
function dutyIssues(m){
  const out={},add=(d,t)=>(out[d]=out[d]||[]).push(t);
  moDays(m).forEach(d=>{const x=dutyOf(d),oc=dutyNames(x.oc),prev=dutyOf(addD(d,-1)).oc;
    if(oc.length&&!oc.some(r=>r.level>=3))add(d,"No R3 or above on call");
    oc.forEach(r=>{if(prev.includes(r.id))add(d,r.name+" is on call two days in a row")})});
  return out;
}
function dutyCounts(m){const c={};const z=id=>c[id]=c[id]||{am:0,oc:0,fri:0};
  moDays(m).forEach(d=>{const x=dutyOf(d);x.am.forEach(id=>z(id).am++);x.oc.forEach(id=>{z(id).oc++;if(!x.am.includes(id))z(id).am++;if(isFri(d))z(id).fri++})});return c}
const dutyTags=ids=>dutyNames(ids).map(r=>`<span class="tag" style="margin:0 4px 3px 0">${esc(r.name)} R${r.level}</span>`).join("")||'<span class="note">—</span>';
function vDuty(){
  if(!DMO)DMO=today().slice(0,7);
  const days=moDays(DMO),iss=dutyIssues(DMO),t=today(),nIss=Object.values(iss).reduce((a,b)=>a+b.length,0);
  let h=`<h2>Duty roster</h2><div class="row noprint" style="margin-bottom:12px"><button class="btn" id="dprev">‹</button><b style="flex:1;text-align:center">${moName(DMO)}</b><button class="btn" id="dnext">›</button></div>
  <div class="row noprint" style="margin-bottom:12px"><button class="btn sm" id="dnow">This month</button>${VIEWER?"":`<button class="btn sm" id="drep">Repeat first week</button><button class="btn sm" id="dclear">Clear month</button>`}<button class="btn sm" id="dshare">Share month</button><button class="btn sm" id="dprint">Print</button><button class="btn sm" id="dcsv">Excel</button></div>
  <p class="note print-only" style="display:none">${esc(ST.name)} · Duty roster ${moName(DMO)}</p>`;
  if(!ST.residents.length)return h+`<div class="empty">Add residents on the Residents tab first.</div>`;
  if(!VIEWER)h+=`<p class="note noprint" style="margin-top:0">Tap a day to choose the morning and 24-hour on-call residents. On call 24h includes the morning. Fill the first week, then press Repeat first week to fill the rest of the month by weekday.</p>`;
  if(nIss)h+=`<div class="panel" style="border-color:var(--warn);margin-bottom:12px"><b style="color:var(--warn)">${nIss} thing${nIss===1?"":"s"} to check</b>${Object.entries(iss).map(([d,a])=>a.map(x=>`<div class="note" style="margin-top:4px">${dShort(d)}: ${esc(x)}</div>`).join("")).join("")}</div>`;
  h+=`<div class="panel" style="padding:4px 8px;overflow-x:auto"><table class="rep duty"><thead><tr><th style="width:64px">Day</th><th>Morning</th><th>On call 24h</th></tr></thead><tbody>`+days.map(d=>{const x=dutyOf(d);
    const bg=d===t?"background:var(--act-soft)":isFri(d)?"background:var(--bg)":"";
    return `<tr ${VIEWER?"":`data-dd="${d}" style="cursor:pointer;${bg}"`} ${VIEWER?`style="${bg}"`:""}><td><b>${dShort(d)}</b>${iss[d]?` <span style="color:var(--warn)" title="${esc(iss[d].join("; "))}">⚠</span>`:""}</td><td>${dutyTags(x.am)}</td><td>${dutyTags(x.oc)}${x.sp?`<div class="note">Specialist: ${esc(x.sp)}</div>`:""}</td></tr>`}).join("")+`</tbody></table></div>`;
  const c=dutyCounts(DMO);
  h+=`<h3>Totals this month</h3><div class="panel" style="padding:4px 8px"><table class="rep"><thead><tr><th>Resident</th><th>Days present<br><span class="note">mornings incl. on-call</span></th><th>On call 24h</th><th>Fridays on call</th></tr></thead><tbody>${sortedRes().map(r=>{const k=c[r.id]||{am:0,oc:0,fri:0};return `<tr><td>${esc(r.name)} R${r.level}</td><td>${k.am}</td><td>${k.oc}</td><td>${k.fri}</td></tr>`}).join("")}</tbody></table></div>`;
  return h;
}
function dutySheet(d){const x=dutyOf(d),prev=dutyOf(addD(d,-1)).oc,next=dutyOf(addD(d,1)).oc;
  const col=(key,sel,hint)=>`<div class="panel attl" style="margin-top:6px">${sortedRes().map(r=>{const h=hint(r);return `<label><input type="checkbox" data-${key}="${r.id}" ${sel.includes(r.id)?"checked":""}> ${esc(r.name)} <span class="note">R${r.level}${h?" · "+h:""}</span></label>`}).join("")}</div>`;
  openSheet(`<h3>${fdw(d)}</h3><h3 style="margin-top:14px">Morning</h3>${col("dam",x.am,r=>{const m=rotAt(r,d);return m?esc(m.n):""})}
  <h3 style="margin-top:14px">On call 24h</h3>${col("doc",x.oc,r=>prev.includes(r.id)?'<span style="color:var(--warn)">on call the day before</span>':next.includes(r.id)?'<span style="color:var(--warn)">on call the day after</span>':"")}
  ${field("Specialist on call (optional)",inp("d_sp",x.sp,'placeholder="Dr. …"'))}
  <div class="row" style="margin-top:12px"><button class="btn p" id="d_save">Save</button><button class="btn" id="d_clr">Clear day</button><button class="btn" id="d_cancel">Cancel</button></div>`);
  const D=DU();
  $("#d_cancel").onclick=closeSheet;
  $("#d_clr").onclick=()=>{delete D.days[d];save();closeSheet();rerender()};
  $("#d_save").onclick=()=>{const g=k=>[...document.querySelectorAll(`[data-${k}]`)].filter(c=>c.checked).map(c=>c.getAttribute("data-"+k));

  const bi=$("#bimp");if(bi)bi.onchange=async()=>{const f=bi.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!confirm("Replace everything with this backup?"))return;const keep={pinHash:ST.pinHash,pinSalt:ST.pinSalt,ownerEmail:ST.ownerEmail};ST=Object.assign({},DEF,d,keep);migrate();seedTables();save();toast("Imported");render()}catch(e){toast("That file could not be read")}};

const enc=new TextEncoder(),dec=new TextDecoder();
const b64=buf=>{let s="";const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pass,salt){const k=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function sha(s){return b64(await crypto.subtle.digest("SHA-256",enc.encode(s)))}

/* PIN pad */
let pinBuf="",pinMode="unlock",pinFirst="",hiddenAt=0;
function showLock(m){pinMode=m;pinBuf="";pinFirst="";$("#lockT").textContent=m==="set"?"Choose a 4-digit PIN":"Enter PIN";$("#lerr").textContent="";drawDots();$("#lock").classList.add("open")}
function drawDots(){$("#dots").innerHTML=[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?"f":""}"></i>`).join("")}
$("#pad").innerHTML=[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button data-k="${k}">${k}</button>`).join("");
$("#pad").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.k;
  if(k==="⌫"){pinBuf=pinBuf.slice(0,-1);drawDots();return}if(pinBuf.length>=4)return;pinBuf+=k;drawDots();if(pinBuf.length<4)return;
  const v=pinBuf;pinBuf="";
  if(pinMode==="unlock"){if(await sha(ST.pinSalt+v)===ST.pinHash){$("#lock").classList.remove("open")}else{$("#lerr").textContent="Wrong PIN";drawDots()}}
  else{if(!pinFirst){pinFirst=v;$("#lockT").textContent="Enter it again";drawDots()}else if(pinFirst===v){ST.pinSalt=b64(crypto.getRandomValues(new Uint8Array(12)));ST.pinHash=await sha(ST.pinSalt+v);save();$("#lock").classList.remove("open");toast("PIN set");render()}else{pinFirst="";$("#lockT").textContent="PINs did not match. Choose a 4-digit PIN";drawDots()}}};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")hiddenAt=Date.now();else if(!VIEWER&&ST.pinHash&&hiddenAt&&Date.now()-hiddenAt>5*60000)showLock("unlock")});

/* ================= live sync (Firebase) ================= */
const FBV="10.12.2",FB="https://www.gstatic.com/firebasejs/"+FBV+"/";
let LIVE=null; // {auth,db,fs,user,role,unsub:[]}
let CFG=null,pendingRender=false,writeT=null,lastWrite=0;
const PUBLIC_KEYS=["v","name","residents","lectures","exams","defTime","duty"];
const PRIVATE_KEYS=["scores","att","rotTypes","rot","rp","graduates","theatre","procs","frame","lecTypes","examTypes","yearStart"];
function pick(o,keys){const r={};keys.forEach(k=>{if(o[k]!==undefined)r[k]=o[k]});return r}
function isEditing(){const a=document.activeElement;return $("#scrim").classList.contains("open")||(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))}
function liveRender(){if(isEditing()){pendingRender=true;return}pendingRender=false;rerender()}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pendingRender&&!isEditing())liveRender()},300));
function pushLive(){
  if(!LIVE||LIVE.role!=="admin")return;
  clearTimeout(writeT);writeT=setTimeout(async()=>{
    const {fs,db}=LIVE;lastWrite=Date.now();
    try{await fs.setDoc(fs.doc(db,"program","public"),JSON.parse(JSON.stringify(pick(ST,PUBLIC_KEYS))));
        await fs.setDoc(fs.doc(db,"program","private"),JSON.parse(JSON.stringify(pick(ST,PRIVATE_KEYS))));setSync("Saved to the cloud")}
    catch(e){setSync("Saving failed: "+(e.code||e.message))}
  },500);
}
let SYNC="";function setSync(t){SYNC=t;const el=$("#syncst");if(el)el.textContent=t}
async function loadCfg(){try{const r=await fetch("firebase-config.json",{cache:"no-store"});if(r.ok){CFG=await r.json();try{localStorage.setItem("ent-program-fbcfg",JSON.stringify(CFG))}catch(e){}}}catch(e){}
  if(!CFG){try{CFG=JSON.parse(localStorage.getItem("ent-program-fbcfg")||"null")}catch(e){}}return CFG&&CFG.apiKey&&CFG.projectId?CFG:null}
async function initLive(){
  const [A,AU,F]=await Promise.all([import(FB+"firebase-app.js"),import(FB+"firebase-auth.js"),import(FB+"firebase-firestore.js")]);
  const app=A.initializeApp(CFG);const auth=AU.getAuth(app);
  let db;try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache()})}catch(e){db=F.getFirestore(app)}
  LIVE={app,auth,db,fs:F,au:AU,user:null,role:null,unsub:[]};
  AU.onAuthStateChanged(auth,u=>{LIVE.user=u;LIVE.unsub.forEach(f=>f());LIVE.unsub=[];if(!u){signInScreen();return}
    if(!u.emailVerified){verifyScreen();return}resolveRole()});
}
function shell(h){document.querySelector("nav.tabs").style.display="none";$("#psub").textContent="";$("#pname").textContent=ST.name||"ENT Residency Program";$("#view").innerHTML=`<div class="gate">${h}</div>`}
function signInScreen(msg){
  shell(`<h2>Sign in</h2><p class="note">Use the email your program director added to the program.</p>
  <label class="f"><span>Email</span><input id="le" type="email" autocomplete="email" dir="ltr"></label>
  <label class="f"><span>Password</span><input id="lp" type="password" autocomplete="current-password" dir="ltr"></label>

  $("#lrs").onclick=async()=>{if(!em()){m("Write your email first.");return}try{await au.sendPasswordResetEmail(auth,em());m("Check your email for a reset link.")}catch(e){m(err(e))}};

function verifyScreen(){
  shell(`<h2>Confirm your email</h2><p>We sent a link to <b dir="ltr">${esc(LIVE.user.email)}</b>. Open it, then come back and press Continue. Check the spam folder too.</p>
  <div class="row"><button class="btn p" id="vc">Continue</button><button class="btn" id="vr">Send the link again</button><button class="btn" id="vo">Sign out</button></div><div id="vm" class="note" style="margin-top:8px"></div>`);
  $("#vc").onclick=async()=>{await LIVE.user.reload();if(LIVE.user.emailVerified){await LIVE.user.getIdToken(true);resolveRole()}else $("#vm").textContent="Not confirmed yet."};
  $("#vr").onclick=async()=>{try{await LIVE.au.sendEmailVerification(LIVE.user);$("#vm").textContent="Sent."}catch(e){$("#vm").textContent=e.code==="auth/too-many-requests"?"Please wait a few minutes before asking again.":e.message}};
  $("#vo").onclick=()=>LIVE.au.signOut(LIVE.auth);
}
async function resolveRole(){
  const {fs,db}=LIVE;shell(`<p class="note">Opening the program…</p>`);
  let role=null;
  try{await fs.getDoc(fs.doc(db,"program","private"));role="admin"}catch(e){}
  if(!role){try{await fs.getDoc(fs.doc(db,"program","public"));role="viewer"}catch(e){}}
  if(!role){shell(`<h2>No access yet</h2><p>Your account <b dir="ltr">${esc(LIVE.user.email)}</b> is not on this program's list.</p><p class="note">Send this email to your program director so they can add you, then press Try again.</p><div class="row"><button class="btn p" id="ta">Try again</button><button class="btn" id="so">Sign out</button></div>`);
    $("#ta").onclick=resolveRole;$("#so").onclick=()=>LIVE.au.signOut(LIVE.auth);return}
  LIVE.role=role;VIEWER=role!=="admin";document.querySelector("nav.tabs").style.display="";
  const pubRef=fs.doc(db,"program","public"),prvRef=fs.doc(db,"program","private");
  if(role==="admin"){
    const pub=await fs.getDoc(pubRef).catch(()=>null),prv=await fs.getDoc(prvRef).catch(()=>null);
    const pd=pub&&pub.exists()?pub.data():null,vd=prv&&prv.exists()?prv.data():null;
    if(!pd){migrate();seedTables();await pushNow();toast("Your program was uploaded to the cloud")}
    else{const local={pinHash:ST.pinHash,pinSalt:ST.pinSalt,ownerEmail:ST.ownerEmail};ST=Object.assign({},DEF,pd,vd||{},local);
      if(migrate()){seedTables();await pushNow();toast("Program updated to the new version")}else seedTables();saveLocal()}
    LIVE.unsub.push(fs.onSnapshot(prvRef,s=>{const d=s.data();if(!d||s.metadata.hasPendingWrites)return;PRIVATE_KEYS.forEach(k=>{if(d[k]!==undefined)ST[k]=d[k]});seedTables();saveLocal();liveRender()}));
    LIVE.unsub.push(fs.onSnapshot(fs.doc(db,"access","lists"),s=>{LIVE.lists=s.data()||{admins:[],viewers:[]};if(TAB==="settings")liveRender()},()=>{}));
  }else{ST.scores={};ST.att={};ST.rot={};ST.rp={};ST.rotTypes=[];ST.theatre={lists:[],weeks:{}};ST.graduates=[];ST.procs=[];ST.frame=[]}
  LIVE.unsub.push(fs.onSnapshot(pubRef,s=>{const d=s.data();if(d&&!(s.metadata.hasPendingWrites&&!VIEWER)){PUBLIC_KEYS.forEach(k=>{if(d[k]!==undefined)ST[k]=d[k]});["lectures","exams","residents"].forEach(k=>{if(!Array.isArray(ST[k]))ST[k]=[]});if(!VIEWER)saveLocal()}
    setSync(s.metadata.hasPendingWrites?"Waiting for internet to save…":"Up to date");liveRender()}));
  if(VIEWER&&!VIEWER_TABS.includes(TAB))TAB="week";
  render();if(!VIEWER&&ST.pinHash)showLock("unlock");
}
async function pushNow(){const {fs,db}=LIVE;await fs.setDoc(fs.doc(db,"program","public"),JSON.parse(JSON.stringify(pick(ST,PUBLIC_KEYS))));await fs.setDoc(fs.doc(db,"program","private"),JSON.parse(JSON.stringify(pick(ST,PRIVATE_KEYS))))}

    const li=(arr,kind)=>(arr||[]).map(e=>`<div class="kv"><span dir="ltr">${esc(e)}</span><span><button class="btn sm d" data-rm="${kind}|${esc(e)}">Remove</button></span></div>`).join("")||'<p class="note">Nobody yet.</p>';

    <div class="row" style="margin-top:8px"><input id="newv" type="email" dir="ltr" placeholder="email@example.com" style="flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)"><button class="btn p" id="addv">Add viewer</button></div>

    <div class="row" style="margin-top:8px"><input id="newa" type="email" dir="ltr" placeholder="email@example.com" style="flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)"><button class="btn" id="adda">Add co-editor</button></div>

  return `<h2>Live sync and access</h2><div class="panel noprint">

  <textarea id="cfgin" placeholder="const firebaseConfig = { apiKey: ... }" style="width:100%;min-height:110px;font:12px ui-monospace,monospace;direction:ltr;border:1px solid var(--line);border-radius:8px;padding:8px"></textarea>

function rulesText(owner){owner=(owner||"YOUR_EMAIL@example.com").trim().toLowerCase();return `rules_version = '2';
service cloud.firestore {
  match /databases/{db}/documents {
    function signedIn() { return request.auth != null && request.auth.token.email_verified == true; }
    function email() { return request.auth.token.email.lower(); }
    function lists() { return get(/databases/$(db)/documents/access/lists).data; }
    function hasLists() { return exists(/databases/$(db)/documents/access/lists); }
    function isOwner() { return signedIn() && email() == '${owner}'; }
    function isAdmin() { return isOwner() || (signedIn() && hasLists() && email() in lists().admins); }
    function isViewer() { return isAdmin() || (signedIn() && hasLists() && email() in lists().viewers); }
    match /access/lists { allow read, write: if isAdmin(); }
    match /program/public { allow read: if isViewer(); allow write: if isAdmin(); }
    match /program/private { allow read, write: if isAdmin(); }
  }
}`}
function parseCfg(t){const g=k=>{const m=t.match(new RegExp(k+'\\s*:\\s*["\\\']([^"\\\']+)["\\\']'));return m?m[1]:null};const c={};["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId"].forEach(k=>{const v=g(k);if(v)c[k]=v});return c.apiKey&&c.projectId&&c.appId?c:null}
function bindAccess(){
  const ps=$("#pinset");if(ps)ps.onclick=()=>showLock("set");
  const po=$("#pinoff");if(po)po.onclick=()=>{if(confirm("Remove the PIN from this device?")){ST.pinHash=null;ST.pinSalt=null;saveLocal();render()}};
  const so=$("#signout"),so2=$("#signout2");[so,so2].forEach(b=>{if(b)b.onclick=()=>{if(LIVE)LIVE.au.signOut(LIVE.auth)}});
  const ow=$("#owner"),ru=$("#rules");if(ow&&ru){const up=()=>{ru.value=rulesText(ow.value);ST.ownerEmail=ow.value.trim();saveLocal()};ow.oninput=up;up();
    $("#copyrules").onclick=async()=>{try{await navigator.clipboard.writeText(ru.value);toast("Rules copied")}catch(e){ru.select();document.execCommand("copy");toast("Rules copied")}}}
  const mk=$("#mkcfg");if(mk)mk.onclick=()=>{const c=parseCfg($("#cfgin").value);if(!c){$("#cfgmsg").textContent="Paste the whole firebaseConfig block from Firebase.";return}download(new Blob([JSON.stringify(c,null,1)],{type:"application/json"}),"firebase-config.json");$("#cfgmsg").textContent="Downloaded. Upload it to GitHub."};
  const addTo=async(kind,inp)=>{const e=$(inp).value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e)){toast("Write a valid email");return}
    const L=LIVE.lists||{admins:[],viewers:[]};const arr=new Set(L[kind]||[]);arr.add(e);const nl={admins:L.admins||[],viewers:L.viewers||[]};nl[kind]=[...arr];
    try{await LIVE.fs.setDoc(LIVE.fs.doc(LIVE.db,"access","lists"),nl);toast("Added "+e)}catch(err){toast("Could not save: "+(err.code||err.message))}};
  const av=$("#addv");if(av)av.onclick=()=>addTo("viewers","#newv");
  const aa=$("#adda");if(aa)aa.onclick=()=>addTo("admins","#newa");
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{const [kind,e]=b.dataset.rm.split("|");if(!confirm("Remove "+e+"?"))return;const L=LIVE.lists;const nl={admins:L.admins||[],viewers:L.viewers||[]};nl[kind]=nl[kind].filter(x=>x!==e);try{await LIVE.fs.setDoc(LIVE.fs.doc(LIVE.db,"access","lists"),nl)}catch(err){toast("Could not save")}});
}
async function start(){
  migrate();seedTables();saveLocal();
  if(await loadCfg()){try{await initLive();return}catch(e){toast("Live sync unavailable offline — showing this device's copy")}}
  render();if(ST.pinHash)showLock("unlock");
}

start();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
